<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>statiq - new project</title>

  <style>
    :root {
      --bg-main: #4d4d4d;
      --bg-secondary: #303030;
      --accent: #9bff61;
      --accent2: #6CE028;
      --blue-accent: #3a5770;
      --text-main: #f5f5f5;
      --text-muted: #cfcfcf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, blinkmacsystemfont, "segoe ui",
        roboto, sans-serif;
    } 
    a {
      text-decoration: none;
    }
    
    p {
      color: var(--text-main);
      padding: 2px;
      
    }
    body {
      min-height: 100vh;
      background: var(--bg-secondary);
      color: var(--text-main);
      user-select: none;
    }

    /* top nav */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      backdrop-filter: blur(12px);
      background: rgba(48, 48, 48, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);;
    }

    nav .logo {
      font-weight: 5;
      letter-spacing: 0.4px;
    }

    nav button {
      background: transparent;
      color: var(--accent);
      padding: 8px 14px;
      cursor: pointer;
      border:none;
      font-size: 10px
      border-radius: 10px;
      border-radius:10px;
      transition: background 0.15s ease, border 0.15s ease;
    }

    nav button:hover {
      background: rgba(155, 255, 97, 0.1);
      border-color: var(--accent);
    }

    /* hero */
    main {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 50vh;
      padding: 140px 24px 124px; /* pushed hero up */
      text-align: center;
    }
    
    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      max-width: 900px;
    }

    h2 {
      justify-content: center;
      text-align: center;
      margin: auto;
      font-size: 30px;
    }
    
    h4 {
      font-size: 20px;
      font-weight: 500;
      max-width: 900px;
      justify-content: center;
      text-align: center;
      padding-top: 50px;
    }
    
    .panelwrap {
      display: flex;
      justify-content: center; /* Centers the 3 panels in the middle of the screen */
      align-items: flex-start; /* Aligns them at the top if heights differ */
      width: 100%;
      flex-wrap: wrap; /* Allows them to stack on small screens */
      gap: 10px; /* Provides space between panels without using margin on children */
    }


  .new {
    text-align: center;
    border-radius: 12px;
    position: fixed;
    background-color: var(--bg-secondary);
    padding: 8px 12px;
    border: 1px solid white;
    transition: border 0.2s ease-in-out;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .new:hover {
    border: 1px solid var(--accent)
  }
    
.menu {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  pointer-events: none;

  border-radius: 12px;
  background-color: var(--bg-secondary);
  padding: 8px 12px;
  border: 1px solid white;

  transition: transform 0.25s ease, opacity 0.25s ease;
}

.menu.active {
  transform: translate(-50%, -50%);
  opacity: 1;
  pointer-events: auto;
}

    textarea {
      border-radius: 12px;
      background-color: var(--bg-main);
      resize: none;
      width: 250px;
      border: 1px solid var(--bg-secondary);
      padding: 6px 6px;
      color: white;
      transition: border 0.25s ease-in-out;
      font-size: 12px;
    }

    textarea:focus {
      border: 1px solid var(--accent);
      outline: none;
    }

    select {
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid white;
      background-color: var(--bg-secondary);
      color: white;
      width: 250px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: border 0.2s ease-in-out, background-color 0.2s ease;
    }

    select:hover {
      border-color: var(--accent);
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: none; /* kills default browser glow */
    }

    /* cancel button styling */
.cancel {
  padding: 8px 16px;
  border-radius: 12px;
  border: none;
  width: 250px;
  background-color: #bd1c1c;
  color: #4f0b0b;
  font-size: 14px;
  cursor: pointer;
  transition: border 0.2s ease-in-out, background-color 0.2s ease-in-out;
  margin-top: 12px; /* spacing from other fields */
}

/* hover effect */
.cancel:hover {
  background-color: #991515; /* slightly different so it feels interactive */
}
    
  </style>
</head>

<body>
<div class="new"><p>+ New Project</p></div>
    <div class="menu"><p>Project Name</p>
      <textarea placeholder="Max Characters: 20" maxlength="20">New Project</textarea>
      <br>
      <p>Description</p>
      <textarea placeholder="Max Characters: 50" maxlength="50">This is a new project</textarea>
      <br>
      <p>Project Visibilit/Code Viewing</p>
      <select id="visibility">
        <option value="private">Public - Anybody can view</option>
        <option value="public">Private - Only me and whoever I invite</option>
      </select>
      <br><br><br>
        <button class="cancel">Cancel</button>
      <br>
      </div>
      </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.querySelector('.new');
  const menu = document.querySelector('.menu');
  const cancel = document.querySelector('.cancel'); // new line

  btn.addEventListener('click', () => {
    menu.classList.toggle('active');
  });

  cancel.addEventListener('click', () => {
    menu.classList.remove('active'); // hide the menu
  });
});
</script>
</body>
</html>
