<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statiq Auth</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #4d4d4d;
  --bg-secondary: #303030;
  --accent: #9bff61;
  --accent2: #6CE028;
  --text-main: #f5f5f5;
  --text-muted: #cfcfcf;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body {
  background: var(--bg-main);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  user-select: none;
}

.back {
  position: fixed;
  color: var(--text-main);
  top: 10px;
  left: 10px;
  background: var(--bg-secondary);
  padding: 6px 12px;
  border-radius: 18px;
  cursor: pointer;
  transition: 0.2s ease;
}
.back:hover { background-color: #b52626; color: #fabebe; }

.auth-wrapper {
  background: var(--bg-secondary);
  padding: 48px;
  border-radius: 18px;
  width: 400px;
}

.tabs { display: flex; margin-bottom: 32px; background: var(--bg-main); border-radius: 12px; padding: 6px; gap: 6px; }
.tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  color: var(--text-muted);
  transition: 0.2s ease;
}
.tab.active { background: var(--accent); color: #1a1a1a; }
.tab:hover { background-color: #404040; }

.panel { display: none; }
.panel.active { display: block; }

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 16px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--bg-main);
  color: var(--text-main);
}
input:focus { border: 1px solid var(--accent); outline: none; }

button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #1a1a1a;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s ease;
}
button:hover { background: var(--accent2); }

#toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #333;
  color: #fff;
  padding: 12px 16px;
  border-radius: 8px;
  display: none;
  z-index: 9999;
}
</style>
</head>
<body>
<div class="back" onclick="window.location.href='https://xyztoast.github.io/statiq'">&lt; Home</div>

<div class="auth-wrapper">
  <div class="tabs">
    <div class="tab active" data-tab="login">Login</div>
    <div class="tab" data-tab="signup">Sign Up</div>
  </div>

  <div class="panel active" id="login">
    <h1>Welcome Back</h1>
    <p>Sign in to continue to Statiq</p>
    <form data-action="login">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required minlength="8">
      <button type="submit">Login</button>
    </form>
  </div>

  <div class="panel" id="signup">
    <h1>Create Account</h1>
    <p>Join Statiq and start building</p>
    <form data-action="signup">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required minlength="8">
      <button type="submit">Sign Up</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
const tabs = document.querySelectorAll('.tab');
const panels = document.querySelectorAll('.panel');
const toast = document.getElementById('toast');

function showToast(msg, success=true) {
  toast.textContent = msg;
  toast.style.backgroundColor = success ? "#4CAF50" : "#f44336";
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 3000);
}

// tab switch
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    panels.forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});

// form submit with fetch + credentials
document.querySelectorAll('.panel form').forEach(form => {
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const formData = new FormData(form);
    const action = form.dataset.action;
    formData.append("action", action);

    try {
      const res = await fetch("https://statiq-auth.micahpcal.workers.dev/auth", {
        method: "POST",
        body: formData,
        credentials: "include",
        mode: "cors"
      });

      if (!res.ok) {
        const text = await res.text();
        showToast(text, false);
        return;
      }

      const text = await res.text();
      showToast(text, true);

      // optional: clear inputs on success
      form.querySelectorAll("input").forEach(i => i.value = "");

    } catch (err) {
      showToast("Network error", false);
    }
  });
});
</script>
</body>
</html>
