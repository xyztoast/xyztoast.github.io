<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statiq Auth Test</title>
<style>
body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #333; color: #fff; }
form { display: flex; flex-direction: column; gap: 10px; width: 250px; }
input, button { padding: 10px; border-radius: 6px; border: none; }
button { cursor: pointer; background: #4caf50; color: #000; font-weight: bold; }
#toast { margin-top: 10px; color: #ffb3b3; }
</style>
</head>
<body>

<form id="authForm">
  <input type="email" name="email" placeholder="email" required>
  <input type="password" name="password" placeholder="password" required>
  <select id="action">
    <option value="login">Login</option>
    <option value="signup">Sign Up</option>
  </select>
  <button type="submit">Submit</button>
  <div id="toast"></div>
</form>

<script>
const form = document.getElementById('authForm');
const toast = document.getElementById('toast');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const formData = new FormData(form);
  formData.append("action", document.getElementById('action').value);

  try {
    const res = await fetch("https://statiq-auth.micahpcal.workers.dev/auth", {
      method: "POST",
      body: formData,
      credentials: "include"
    });
    const text = await res.text();
    toast.textContent = text;
    toast.style.color = res.ok ? "#b3ffb3" : "#ffb3b3";
  } catch {
    toast.textContent = "Network error";
    toast.style.color = "#ffb3b3";
  }
});
</script>

</body>
</html>
