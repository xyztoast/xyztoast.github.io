<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statiq Auth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #4d4d4d;
      --bg-secondary: #303030;
      --accent: #9bff61;
      --accent2: #6CE028;
      --blue-accent: #3a5770;
      --text-main: #f5f5f5;
      --text-muted: #cfcfcf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .back {
      position: fixed;
      color: var(--text-main);
      top: 10px;
      left: 10px;
      background: var(--bg-secondary);
      padding: 6px;
      border-radius: 18px;
      transition: 0.2s ease;
    }
    
    .back:hover {
        background-color: #b52626;
        color: #fabebe;
    }
    
    .auth-wrapper {
      background: var(--bg-secondary);
      padding: 48px;
      border-radius: 18px;
      width: 400px;
    }

    .tabs {
      display: flex;
      margin-bottom: 32px;
      background: var(--bg-main);
      border-radius: 12px;
      padding: 6px;
      gap: 6px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      gap: 10px;
      color: var(--text-muted);
      transition: 0.2s ease;
    }
    
    .tab:hover {
        background-color: #404040;
    }

    .tab.active {
      background: var(--accent);
      color: #1a1a1a;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: var(--bg-main);
      color: var(--text-main);
      transition: 0.2s ease;
    }

    input:focus {
      border: 1px solid var(--accent);
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #1a1a1a;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: var(--accent2);
    }

    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent);
      color: #1a1a1a;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
      z-index: 9999;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
    <a href="https://xyztoast.github.io/statiq"><div class="back">< Home</div></a>
  <div class="auth-wrapper">
    <div class="tabs">
      <div class="tab active" data-tab="login">Login</div>
      <div class="tab" data-tab="signup">Sign Up</div>
    </div>

<div class="panel active" id="login">
  <h1>Welcome Back</h1>
  <p>Sign in to continue to Statiq</p>
  <form method="POST" action="https://statiq-auth.micahpcal.workers.dev/auth">
    <input type="hidden" name="action" value="login" />
    <input type="email" name="email" placeholder="Email" required />
    <input type="password" name="password" placeholder="Password" required minlength="8" />
    <button type="submit">Login</button>
  </form>
</div>

<div class="panel" id="signup">
  <h1>Create Account</h1>
  <p>Join Statiq and start building</p>
  <form method="POST" action="https://statiq-auth.micahpcal.workers.dev/auth">
    <input type="hidden" name="action" value="signup" />
    <input type="email" name="email" placeholder="Email" required />
    <input type="password" name="password" placeholder="Password" required minlength="8" />
    <button type="submit">Sign Up</button>
  </form>
</div>

<div id="toast"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // tabs
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    });
  });

  // toast helper
  const toast = document.getElementById("toast");
  function showToast(msg, success = true) {
    toast.textContent = msg;
    toast.style.backgroundColor = success ? "var(--accent)" : "#f44336";
    toast.style.display = "block";
    setTimeout(() => (toast.style.display = "none"), 3000);
  }

  // intercept forms
  document.querySelectorAll(".auth-wrapper form").forEach(form => {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);

      try {
        const res = await fetch(form.action, {
          method: form.method || "POST",
          body: formData,
          credentials: "include" // keep session cookie
        });
        const text = await res.text();
        showToast(text, res.ok);
      } catch {
        showToast("Network error", false);
      }
    });
  });
});
</script>
</body>
</html>
