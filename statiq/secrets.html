<div class="secret-panel">
  <h2>Your Secrets</h2>

  <div class="save-secret">
    <input type="text" id="secret-key" placeholder="Secret Key" />
    <input type="text" id="secret-value" placeholder="Secret Value" />
    <button id="save-secret-btn">Save Secret</button>
  </div>

  <h3>Saved Secrets</h3>
  <ul id="secret-list"></ul>
</div>
<script>
  // for testing, use email/password from login form or session later
const email = "user@example.com";
const password = "password123";

async function saveSecret() {
  const key = document.getElementById("secret-key").value;
  const value = document.getElementById("secret-value").value;

  const formData = new FormData();
  formData.append("key", key);
  formData.append("value", value);
  formData.append("email", email);
  formData.append("password", password);

  const res = await fetch("https://statiq-auth.micahpcal.workers.dev/secret/save", {
    method: "POST",
    body: formData
  });

  const text = await res.text();
  alert(text);
  loadSecrets();
}

async function loadSecrets() {
  const url = `https://statiq-auth.micahpcal.workers.dev/secret/get?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;
  const res = await fetch(url);
  const secrets = await res.json();

  const list = document.getElementById("secret-list");
  list.innerHTML = "";
  secrets.forEach(s => {
    const li = document.createElement("li");
    li.textContent = `${s.key}: ${s.value}`;
    list.appendChild(li);
  });
}

document.getElementById("save-secret-btn").addEventListener("click", saveSecret);

// load secrets on page load
loadSecrets();

</script>
