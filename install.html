<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>install</title>
  <link rel="stylesheet" href="/app/style.css">
</head>
<body>
  <div class="install-container">
    <h1>install idktoast mods</h1>
    <p>get the app on your home screen for a better experience 🥀</p>
    <button id="installBtn">install</button>
    <p id="msg"></p>
  </div>

  <script>
    let deferredPrompt;
    const btn = document.getElementById('installBtn');
    const msg = document.getElementById('msg');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = 'block';
    });

    btn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        msg.textContent = 'thanks for installing! it was successful';
      } else {
        msg.textContent = 'didnt work, thats an issue on my part. leave a pull request on the github repo and ill try to fix it';
      }
      deferredPrompt = null;
      btn.style.display = 'none';
    });
  </script>
</body>
</html>
