<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Install idktoast Mods</title>
  <style>
    body {
      background-color: #212425;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    button {
      background-color: #00b2ff;
      border: none;
      padding: 1em 2em;
      font-size: 1.2em;
      color: #212425;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 1em;
    }
    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <h1>download the webapp</h1>
  <button id="actionBtn">install</button>

  <script>
    const btn = document.getElementById('actionBtn');
    let deferredPrompt;

    // detect if PWA can be installed
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.textContent = 'install';
      btn.style.display = 'inline-block';
    });

    // detect if PWA is already installed
    window.addEventListener('appinstalled', () => {
      btn.textContent = 'open app';
      btn.onclick = () => window.location.href = '/app/';
    });

    // on page load, check if already installed
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
      btn.textContent = 'open app';
      btn.onclick = () => window.location.href = '/app/';
    } else {
      btn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        if (choice.outcome === 'accepted') {
          btn.textContent = 'open app';
          btn.onclick = () => window.location.href = '/app/';
        }
        deferredPrompt = null;
      });
    }
  </script>
</body>
</html>
