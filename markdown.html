<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Markdown Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
        /* Style markdown preview output */
        .prose pre {
            background-color: #2d3748;
            padding: 1rem;
            border-radius: 0.375rem;
            color: #fff;
        }
        .prose code {
            font-family: monospace;
        }
    </style>
</head>
<body class="bg-[#1e1e1e] text-gray-200 h-screen flex flex-col overflow-hidden font-sans">

    <header class="h-12 border-b border-[#2d2d2d] bg-[#181818] flex items-center justify-between px-6 z-10 select-none">
        <div class="flex items-center gap-2">
            <span class="text-emerald-400 font-bold text-lg">⚡</span>
            <h1 class="font-semibold text-sm tracking-wide text-gray-300">MONACO.MD</h1>
        </div>
        <div class="text-xs text-gray-500 font-mono">Markdown Live Preview</div>
    </header>

    <main id="container" class="flex flex-1 w-full relative overflow-hidden">
        
        <div id="left-panel" class="h-full min-w-[200px]" style="width: 50%;">
            <div id="editor" class="w-full h-full"></div>
        </div>

        <div id="resizer" class="w-1.5 h-full bg-[#2d2d2d] hover:bg-emerald-500 active:bg-emerald-600 cursor-col-resize transition-colors duration-150 z-20 relative flex items-center justify-center">
            <div class="w-[2px] h-6 bg-gray-600 rounded"></div>
        </div>

        <div id="right-panel" class="h-full bg-[#1a1a1a] overflow-y-auto min-w-[200px] p-8 flex-1">
            <div id="preview" class="prose max-w-none text-gray-300 
                prose-headings:text-gray-100 prose-headings:font-semibold
                prose-h1:text-3xl prose-h1:border-b prose-h1:border-[#2d2d2d] prose-h1:pb-2
                prose-h2:text-2xl prose-h2:mt-6
                prose-p:leading-relaxed prose-p:my-4
                prose-a:text-emerald-400 hover:prose-a:underline
                prose-strong:text-white
                prose-ul:list-disc prose-ul:ml-6
                prose-ol:list-decimal prose-ol:ml-6
                prose-blockquote:border-l-4 prose-blockquote:border-emerald-500 prose-blockquote:pl-4 prose-blockquote:italic prose-blockquote:text-gray-400">
            </div>
        </div>

    </main>

    <script>
        // --- 1. Default Content ---
        const initialMarkdown = `# Welcome to the Monaco Markdown Editor!

This is a modern, high-performance Markdown editor powered by the **Monaco Editor** engine.

## Features
* **Live Preview:** Real-time updates as you type.
* **Draggable Splitter:** Adjust the panels to fit your workflow.
* **Monaco Power:** Code completion, multi-cursor editing, and robust shortcuts.

### Code Block Example
\`\`\`javascript
const greeting = "Hello World";
function sayHello() {
    console.log(greeting);
}
\`\`\`

> "Simplicity is the ultimate sophistication." — Leonardo da Vinci
`;

        // --- 2. Initialize Monaco Editor ---
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });

        require(['vs/editor/editor.main'], function () {
            // Configure marked options for security/rendering
            marked.setOptions({
                breaks: true,
                gfm: true
            });

            const editorContainer = document.getElementById('editor');
            const previewContainer = document.getElementById('preview');

            // Create Editor instance
            const editor = monaco.editor.create(editorContainer, {
                value: initialMarkdown,
                language: 'markdown',
                theme: 'vs-dark',
                automaticLayout: true, // Forces Monaco to adapt when container size changes
                fontFamily: 'Fira Code, JetBrains Mono, Cascadia Code, monospace',
                fontSize: 14,
                lineHeight: 22,
                minimap: { enabled: false },
                wordWrap: 'on',
                padding: { top: 16, bottom: 16 },
                scrollbar: {
                    verticalScrollbarSize: 10,
                    horizontalScrollbarSize: 10
                }
            });

            // Function to update preview
            function updatePreview() {
                const rawMarkdown = editor.getValue();
                previewContainer.innerHTML = marked.parse(rawMarkdown);
            }

            // Listen for changes
            editor.onDidChangeModelContent(updatePreview);

            // Initial render
            updatePreview();

            // --- 3. Draggable Splitter Functionality ---
            const container = document.getElementById('container');
            const leftPanel = document.getElementById('left-panel');
            const resizer = document.getElementById('resizer');

            let isDragging = false;

            resizer.addEventListener('mousedown', function (e) {
                isDragging = true;
                // Add an overlay class or pointer-events block to prevent iframe/text selections from hijacking drag
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', function (e) {
                if (!isDragging) return;

                // Calculate width percentages relative to main container bounds
                const containerRect = container.getBoundingClientRect();
                const currentX = e.clientX - containerRect.left;
                
                let widthPercentage = (currentX / containerRect.width) * 100;

                // Set hard bounds so panels don't disappear completely
                if (widthPercentage < 15) widthPercentage = 15;
                if (widthPercentage > 85) widthPercentage = 85;

                leftPanel.style.width = `${widthPercentage}%`;
                
                // Note: 'automaticLayout: true' in Monaco configuration will 
                // automatically pick up this resizing event seamlessly.
            });

            document.addEventListener('mouseup', function () {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = 'auto';
                }
            });
        });
    </script>
</body>
</html>
