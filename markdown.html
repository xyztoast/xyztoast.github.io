<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor | v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #1e1e1e;
        }
        .main-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }
        #editor-pane {
            height: 100%;
            min-width: 100px;
            width: 50%;
        }
        #preview-pane {
            flex-grow: 1;
            height: 100%;
            background: #ffffff;
            min-width: 100px;
            overflow-y: auto; /* Allow preview container box scrolling */
        }
        #resizer {
            width: 8px;
            cursor: col-resize;
            background-color: #2d2d2d;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            position: relative;
        }
        #resizer:hover, .resizing #resizer {
            background-color: #3b82f6;
        }
        #resizer::after {
            content: "";
            width: 2px;
            height: 30px;
            background-color: #444;
            border-radius: 2px;
        }
        /* Gear Button */
        #settings-trigger {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 30;
            transition: transform 0.2s;
        }
        #settings-trigger:hover {
            transform: translateX(-50%) scale(1.1) rotate(45deg);
        }
        /* Settings Panel */
        #settings-panel {
            position: absolute;
            bottom: 60px;
            left: -136px; 
            width: 280px;
            max-height: 70vh;
            background: #252526;
            border: 1px solid #454545;
            border-radius: 8px;
            z-index: 40;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            cursor: default;
        }
        #settings-panel.active {
            display: flex;
        }
        .settings-content {
            overflow-y: auto;
            padding: 16px;
        }
        .setting-item {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .setting-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            font-weight: bold;
        }
        select, input {
            background: #3c3c3c;
            border: 1px solid #555;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        select:focus { border-color: #3b82f6; }
        .resizing { cursor: col-resize; user-select: none; }
    </style>
</head>
<body class="text-white">

    <div class="main-container" id="container">
        <div id="editor-pane">
            <div id="editor-container" class="h-full w-full"></div>
        </div>

        <div id="resizer">
            <div id="settings-trigger" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>            
            <div id="settings-panel">
                <div class="p-3 border-b border-gray-700 font-bold text-sm bg-[#2d2d2d] flex justify-between items-center">
                    <span>Editor Settings</span>
                    <button id="close-settings" class="hover:text-red-400 p-1">✕</button>
                </div>
                <div class="settings-content">
                    <div class="setting-item">
                        <label class="setting-label">Theme</label>
                        <select id="set-theme">
                            <option value="vs-dark">Visual Studio Dark</option>
                            <option value="vs">Visual Studio Light</option>
                            <option value="hc-black">High Contrast</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Font Size</label>
                        <input type="number" id="set-fontsize" value="14" min="8" max="32">
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Word Wrap</label>
                        <select id="set-wordwrap">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Line Numbers</label>
                        <select id="set-linenumbers">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                            <option value="relative">Relative</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Minimap</label>
                        <select id="set-minimap">
                            <option value="false">Hidden</option>
                            <option value="true">Visible</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Cursor Style</label>
                        <select id="set-cursor">
                            <option value="line">Line</option>
                            <option value="block">Block</option>
                            <option value="underline">Underline</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">Tab Size</label>
                        <select id="set-tabsize">
                            <option value="2">2 Spaces</option>
                            <option value="4" selected>4 Spaces</option>
                            <option value="8">8 Spaces</option>
                        </select>
                    </div>
                    <div class="setting-item">
