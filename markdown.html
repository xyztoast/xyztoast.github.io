<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Markdown Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #1e1e1e;
    --panel-bg: #252526;
    --border: #3c3c3c;
    --text: #d4d4d4;
    --accent: #569cd6;
    --toolbar-bg: #2d2d2d;
    --preview-bg: #1e1e1e;
    --preview-text: #d4d4d4;
    --code-bg: #2d2d2d;
    --link: #4fa8ff;
    --table-border: #3c3c3c;
    --table-head-bg: #2a2a2a;
    --table-stripe: #252525;
    --blockquote-text: #a0a0a0;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f5f5;
      --panel-bg: #ffffff;
      --border: #ddd;
      --text: #222;
      --toolbar-bg: #eeeeee;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e;
    --panel-bg: #252526;
    --border: #3c3c3c;
    --text: #d4d4d4;
    --toolbar-bg: #2d2d2d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    height: 44px;
    flex-shrink: 0;
  }
  #toolbar .title {
    font-weight: 600;
    font-size: 14px;
    margin-right: auto;
    color: var(--text);
  }
  button.tbtn {
    background: var(--panel-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.tbtn:hover { filter: brightness(1.2); }
  #main {
    display: flex;
    height: calc(100% - 44px);
    width: 100%;
  }
  #editor-pane, #preview-pane {
    height: 100%;
    overflow: hidden;
    position: relative;
  }
  #editor-pane { width: 50%; min-width: 150px; }
  #preview-pane {
    width: 50%;
    min-width: 150px;
    background: var(--preview-bg);
    overflow-y: auto;
  }
  #divider {
    width: 6px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
  }
  #divider:hover { background: var(--accent); }
  #editor-container { width: 100%; height: 100%; }
  #preview {
    color: var(--preview-text);
    padding: 24px 32px;
    max-width: 900px;
    margin: 0 auto;
    line-height: 1.6;
    font-size: 15px;
    word-wrap: break-word;
  }
  #preview h1, #preview h2, #preview h3, #preview h4 {
    border-bottom: 1px solid var(--table-border);
    padding-bottom: 6px;
    margin-top: 24px;
  }
  #preview h1 { font-size: 1.8em; }
  #preview h2 { font-size: 1.4em; }
  #preview code {
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 4px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 0.9em;
  }
  #preview pre {
    background: var(--code-bg);
    padding: 12px 16px;
    border-radius: 8px;
    overflow-x: auto;
  }
  #preview pre code { background: none; padding: 0; }
  #preview blockquote {
    border-left: 4px solid var(--table-border);
    margin: 0;
    padding: 4px 16px;
    color: var(--blockquote-text);
  }
  #preview table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    display: block;
    overflow-x: auto;
  }
  #preview th, #preview td {
    border: 1px solid var(--table-border);
    padding: 6px 13px;
  }
  #preview th {
    background: var(--table-head-bg);
    font-weight: 600;
  }
  #preview tr:nth-child(2n) { background: var(--table-stripe); }
  #preview img { max-width: 100%; }
  #preview a { color: var(--link); }
  #preview input[type="checkbox"] { margin-right: 6px; }
  #preview hr { border: none; border-top: 1px solid var(--table-border); margin: 24px 0; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  @media (max-width: 700px) {
    #main { flex-direction: column; }
    #editor-pane, #preview-pane { width: 100% !important; height: 50%; }
    #divider { width: 100%; height: 6px; cursor: row-resize; }
  }
</style>
</head>
<body>

<div id="toolbar">
  <span class="title">Markdown Editor</span>
  <button class="tbtn" id="btn-upload">Open .md</button>
  <button class="tbtn" id="btn-download">Save .md</button>
  <button class="tbtn" id="btn-clear">Clear</button>
</div>

<div id="main">
  <div id="editor-pane">
    <div id="editor-container"></div>
  </div>
  <div id="divider"></div>
  <div id="preview-pane">
    <div id="preview"></div>
  </div>
</div>

<input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs/loader.js"></script>
<script>
  marked.setOptions({ gfm: true, breaks: false });

  const DEFAULT_TEXT = "# Welcome to your Markdown Editor\n\n" +
    "Type on the left, see the rendered preview on the right.\n\n" +
    "## Features\n\n" +
    "- **Bold**, *italic*, ~~strikethrough~~\n" +
    "- Nested lists\n" +
    "  - like this\n" +
    "- [x] Task done\n" +
    "- [ ] Task pending\n\n" +
    "### Tables\n\n" +
    "| Feature | Supported |\n" +
    "|---------|-----------|\n" +
    "| Tables | Yes |\n" +
    "| Code blocks | Yes |\n" +
    "| Links | Yes |\n\n" +
    "### Code\n\n" +
    "```javascript\n" +
    "function hello() {\n" +
    "  console.log('hello world');\n" +
    "}\n" +
    "```\n\n" +
    "> Blockquote example\n\n" +
    "---\n\n" +
    "[A link](https://example.com) and `inline code`.\n";

  let editor;
  const STORAGE_KEY = "md-editor-content";

  function renderPreview(text) {
    const rawHtml = marked.parse(text);
    const clean = DOMPurify.sanitize(rawHtml);
    document.getElementById("preview").innerHTML = clean;
  }

  function loadSaved() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved !== null ? saved : DEFAULT_TEXT;
    } catch (e) {
      return DEFAULT_TEXT;
    }
  }

  function saveContent(text) {
    try { localStorage.setItem(STORAGE_KEY, text); } catch (e) {}
  }

  require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs" } });
  require(["vs/editor/editor.main"], function () {
    const startText = loadSaved();

    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    monaco.editor.setTheme(prefersDark ? "vs-dark" : "vs-dark");

    editor = monaco.editor.create(document.getElementById("editor-container"), {
      value: startText,
      language: "markdown",
      theme: "vs-dark",
      automaticLayout: true,
      wordWrap: "on",
      minimap: { enabled: false },
      fontSize: 14,
      scrollBeyondLastLine: false,
      padding: { top: 12 }
    });

    renderPreview(startText);

    editor.onDidChangeModelContent(() => {
      const val = editor.getValue();
      const prevScrollTop = previewPane.scrollTop;
      renderPreview(val);
      previewPane.scrollTop = prevScrollTop;
      saveContent(val);
    });

    // Sync preview scroll to editor scroll position
    let syncingFromEditor = false;
    let syncingFromPreview = false;

    editor.onDidScrollChange(() => {
      if (syncingFromPreview) return;
      const scrollTop = editor.getScrollTop();
      const scrollHeight = editor.getScrollHeight() - editor.getLayoutInfo().height;
      const pct = scrollHeight > 0 ? scrollTop / scrollHeight : 0;

      const preview = previewPane;
      const targetTop = pct * (preview.scrollHeight - preview.clientHeight);

      syncingFromEditor = true;
      preview.scrollTop = targetTop;
      requestAnimationFrame(() => { syncingFromEditor = false; });
    });

    previewPane.addEventListener("scroll", () => {
      if (syncingFromEditor) return;
      const pct = previewPane.scrollTop / (previewPane.scrollHeight - previewPane.clientHeight || 1);
      const scrollHeight = editor.getScrollHeight() - editor.getLayoutInfo().height;
      const targetTop = pct * scrollHeight;

      syncingFromPreview = true;
      editor.setScrollTop(targetTop);
      requestAnimationFrame(() => { syncingFromPreview = false; });
    });
  });

  // Divider drag-to-resize
  const divider = document.getElementById("divider");
  const editorPane = document.getElementById("editor-pane");
  const previewPane = document.getElementById("preview-pane");
  const mainEl = document.getElementById("main");
  let dragging = false;

  divider.addEventListener("mousedown", () => { dragging = true; document.body.style.userSelect = "none"; });
  window.addEventListener("mouseup", () => { dragging = false; document.body.style.userSelect = ""; });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const isVertical = window.innerWidth > 700;
    if (isVertical) {
      const rect = mainEl.getBoundingClientRect();
      let pct = ((e.clientX - rect.left) / rect.width) * 100;
      pct = Math.min(85, Math.max(15, pct));
      editorPane.style.width = pct + "%";
      previewPane.style.width = (100 - pct) + "%";
    }
  });

  // Toolbar actions
  document.getElementById("btn-clear").addEventListener("click", () => {
    if (confirm("Clear all content?")) {
      editor.setValue("");
      editor.focus();
    }
  });

  document.getElementById("btn-download").addEventListener("click", () => {
    const text = editor.getValue();
    const blob = new Blob([text], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "document.md";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("btn-upload").addEventListener("click", () => {
    document.getElementById("file-input").click();
  });

  document.getElementById("file-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      editor.setValue(ev.target.result);
    };
    reader.readAsText(file);
    e.target.value = "";
  });
</script>

</body>
</html>
