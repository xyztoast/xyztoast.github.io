  </div>
  <div class="spacing" style="padding-top: 5%;">

<div class="form">
<h2 style="color: #00b2ff">if only this was a mod...</h2>
<p style="color: #ffffff;">drop your mod ideas here</p>
<form>
<textarea id="idea" placeholder="what if you made a..." required></textarea>
<div class="spacing" style="padding: 2px;"></div>
    <div class="mod-ideas">
<textarea id="name" placeholder="name" maxlength="20" required></textarea>
<button id="submit" type="submit" class="submit">submit</button>
    </div>
</form>
    
  <div class="spacing" style="padding-top: 25px;">
  <h2>main site</h2>
  <a href="https://xyztoast.github.io" style="text-decoration: none; color: #ffffff;">click here for the main site</a>
<script>
const submitBtn = document.querySelector("#submit"); // your button
const ideaText = document.querySelector("#idea");    // the mod idea textarea
const nameInput = document.querySelector("#name");   // the name textarea
let formMessage = document.createElement("div");     // feedback div
formMessage.style.color = "#fff";
formMessage.style.marginTop = "4px";
submitBtn.parentNode.appendChild(formMessage);

submitBtn.addEventListener("click", async (e) => {
  e.preventDefault(); // prevent the default form submission

  const idea = ideaText.value.trim();
  const name = nameInput.value.trim() || "anonymous";

  if (!idea || !name) {
    formMessage.textContent = "please fill in both fields";
    return;
  }

  try {
    const res = await fetch("https://ideas-idktoast.vercel.app/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idea, name })
    });

    const data = await res.json();

    if (data.success) {
      formMessage.textContent = `<br>idea submitted!`;
      ideaText.value = "";
      nameInput.value = "";
    } else {
      formMessage.textContent = "oops, something went wrong!";
    }
  } catch (err) {
    console.error(err);
    formMessage.textContent = "network error";
  }
});
</script>
