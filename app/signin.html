<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #212425;
      color: #fff;
      font-family: sans-serif;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background: #00b2ff;
      color: #212425;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #008ecc; }
  </style>
</head>
<body>
  <button id="loginBtn">Sign in with GitHub</button>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://cinbonvmvzmnkdvhfsjg.supabase.co/auth/v1/callback/'
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpbmJvbnZtdnptbmtkdmhmc2pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5OTI5NjQsImV4cCI6MjA3OTU2ODk2NH0.gzijxk-TpJ9FfEbNXPdQ8ODJksH5TOjaYXxF22rYLc8' // replace with your anon key
    const supabase = createClient(supabaseUrl, supabaseAnonKey)

    const loginBtn = document.getElementById('loginBtn')
    loginBtn.addEventListener('click', async () => {
      const { error } = await supabase.auth.signInWithOAuth({ provider: 'github' })
      if (error) alert('Login failed 💀 check console')
    })

    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        document.body.innerHTML = `<h2>Welcome, ${session.user.user_metadata.full_name || session.user.email}!</h2>
                                   <button id="logoutBtn">Sign out</button>`
        document.getElementById('logoutBtn').addEventListener('click', async () => {
          await supabase.auth.signOut()
          location.reload()
        })
      }
    })
  </script>
</body>
</html>
