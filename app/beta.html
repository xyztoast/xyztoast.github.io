<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>idktoast mods</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:'Roboto', sans-serif;
      background: #212425;
      color:#00b2ff
    }
    .wrap{
      height:100%;
      display:flex;
     
      flex-direction:column;
      align-items:center;
      justify-content:top;
      gap:16px;
      text-align:center;
    }
    h1{
      font-weight:700;
      margin:0;
      font-size:60px;
    }
    h4{
      font-weight: 100;
      margin:0;
      font-size:40px
    }
    a{
      color:#00b2ff;
      text-decoration:none;
      font-weight: 550;
      padding:6px 5px;
      border-radius:6px;
    }

    .beta-btn {
    position: fixed;
    bottom: 15px;
    left: 60px;
    display: inline-flex;
    align-items: left;
    gap: 8px;
    padding: 12px 12px;
    text-decoration: none;
    color: #bebebe;
    font-size: 18px
    }

     .unreleased-btn {
    position: fixed;
    bottom: 15px;
    right: 100px;
    display: inline-flex;
    align-items: right;
    gap: 8px;
    padding: 12px 12px;
    text-decoration: none;
    color: #bebebe;
    font-size: 18px
    }
    
    .footer-panel {
      position: fixed;
      align-items: center;
      left: 0px;
      bottom: 0px;
      width: 100vw;
      background: rgba(33, 36, 37, 0.6);
      padding: 35px;
      text-color: #323738;
      font-size: 10px;
      backdrop-filter: blur(3px);
      margin-top: 10px;
    }

    .header-panel {
      position: fixed;
      place-items: center;
      margin: auto;
      width: 100vw;
      left: 0px;
      top: 0px;
      background-color: rgba(33, 36, 37, 0.7);
      text-color: #00b2ff;
      width: 100vw;
      text-align: center;
      font-size: 40px;
      height: 75px;
      backdrop-filter: blur(3px);
    }


    .unnamed-pack {
      background-color: #323738;
      left: 180px;
      bottom: 200px
    }
    .file-card {
      background: #323738;
      width: 70vw;
      padding: 20px;
      border-radius: 15px;
      margin: auto;
      margin-bottom: 20px;
    }

    .file-name {
      font-size: 15px;
      font-weight: bold;
      color: #00b2ff;
      margin: auto;
      margin-bottom: 10px;
    }

    .file-desc {
      font-size: 15px;
      line-height: 1.4;
      user-select: none;
    }
    .content {
      top: 100px;
      width: 100vw;
      height: calc(100vh - 10px);
      overflow-y: auto;
      padding-bottom: 75px;
      }
      
  </style>
</head>
<body>
  </div>

  </a> 
  <div class="footer-panel">
  </div>
    <div class="header-panel">
  </div>
  
      
    <p> <span class="header-panel"><strong>beta<strong><p>
 <div class="content">     
  <br><br><br><br><div class="file-card">
    <div class="file-name"><img src="/app/img/earl" alt="file preview" style="width:100%; border-radius:8px;"></div>
    <p class="file-desc">unnamed 16x pvp pack</p>
   </div>
 </div>
   <div>
    <div class="footer-panel">  
    <a class="beta-btn" href="https://xyztoast.github.io/app/">home</a>
  </a>
  
  </a> 
  <a class="unreleased-btn" href="https://xyztoast.github.io/app/unreleased">unreleased</a>
      </div>
    </div>
<script>
if (!window.matchMedia('(display-mode: standalone)').matches) {
  
  window.location.href = 'https://xyztoast.github.io/app';
}
</script>
</body>
</html>
