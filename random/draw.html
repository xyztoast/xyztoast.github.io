<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>pixel editor</title>
  <style>
    :root{
      --accent:#00b2ff;
      --bg:#212425;
      --panel:#323738;
      --text:#e6e66;
      --muted:#9aa0a0;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;}
    .wrap{display:flex;gap:18px;padding:20px;align-items:flex-start;max-width:1200px;margin:20px auto}
    .left{background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border-radius:12px;padding:14px;width:680px;box-sizing:border-box;border:1px solid rgba(255,255,255,0.03)}
    .right{width:320px;background:var(--panel);border-radius:12px;padding:14px;box-sizing:border-box;border:1px solid rgba(0,0,0,0.25)}
    h1{font-size:16px;margin:0 0 12px 0;color:var(--accent)}
    .canvas-wrap{display:grid;place-items:center;background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);padding:12px;border-radius:8px}
    canvas{background:#fff;border-radius:4px;image-rendering:pixelated;display:block;}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
    select,input[type=text]{background:var(--panel);border:1px solid rgba(0,0,0,0.3);color:var(--text);padding:8px;border-radius:6px}
    label{font-size:12px;color:var(--muted)}
    .btn{background:var(--accent);border:none;color:#021017;padding:8px 12px;border-radius:8px;cursor:pointer}
    .small{padding:6px 8px;font-size:13px}
    .swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .swatch{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,0.4);cursor:pointer}
    .tools{display:flex;gap:8px;margin-top:12px}
    .tool{background:transparent;border:1px solid rgba(255,255,255,0.03);padding:8px;border-radius:8px;cursor:pointer;color:var(--text)}
    .footer{font-size:12px;color:var(--muted);margin-top:12px}
    .title-row{display:flex;justify-content:space-between;align-items:center}
    .filename{width:100%;box-sizing:border-box}
    .grid-toggle{font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="title-row">
        <h1>pixel editor</h1>
        <div style="font-size:13px;color:var(--muted)">resolution: <span id="curRes">32x32</span></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="display" width="512" height="512"></canvas>
      </div>

      <div class="controls">
        <label for="res">resolution</label>
        <select id="res">
          <option value="16">16</option>
          <option value="32" selected>32</option>
          <option value="64">64</option>
        </select>

        <label for="picker">color</label>
        <input id="picker" type="color" value="#00b2ff">
        <input id="hexInput" type="text" value="#00b2ff" style="width:90px" title="hex"> 

        <div style="margin-left:8px;display:flex;gap:8px;align-items:center">
          <button class="btn small" id="eraser">eraser</button>
          <button class="tool" id="fillBtn">fill</button>
          <button class="tool" id="toggleGrid">toggle grid</button>
          <button class="btn small" id="clear">clear</button>
        </div>
      </div>

      <div class="controls" style="justify-content:space-between">
        <div style="display:flex;gap:8px;align-items:center">
          <label for="filename">file name</label>
          <input id="filename" class="filename" type="text" value="pixel-art" placeholder="file name">
        </div>
        <div style="display:flex;gap:8px">
          <label for="exportSize">export size</label>
          <select id="exportSize">
            <option value="256">256</option>
            <option value="512" selected>512</option>
            <option value="1024">1024</option>
          </select>
          <button class="btn" id="download">download png</button>
        </div>
      </div>

      <div class="footer">draw with mouse or touch. hold shift for straight lines. last 10 colors saved locally.</div>
    </div>

    <div class="right">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong style="color:var(--accent)">palette</strong>
        <button id="importPalette" class="tool">import</button>
      </div>

      <div style="margin-top:10px">
        <div class="swatches" id="recentColors"></div>
      </div>

      <div style="margin-top:12px">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">tools</div>
        <div class="tools">
          <button class="tool" id="pickBtn">pick</button>
          <button class="tool" id="panBtn">pan</button>
        </div>
      </div>

      <div style="margin-top:14px">
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px">quick actions</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn small" id="invert">invert</button>
          <button class="btn small" id="flipH">flip h</button>
          <button class="btn small" id="flipV">flip v</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // basic pixel editor. keeps a tiny offscreen buffer of size res x res with rgba strings per pixel
    const display = document.getElementById('display');
    const ctx = display.getContext('2d');
    const resSelect = document.getElementById('res');
    const curResLabel = document.getElementById('curRes');
    const picker = document.getElementById('picker');
    const hexInput = document.getElementById('hexInput');
    const recentColorsWrap = document.getElementById('recentColors');
    const filenameInput = document.getElementById('filename');
    const downloadBtn = document.getElementById('download');
    const exportSize = document.getElementById('exportSize');
    const eraserBtn = document.getElementById('eraser');
    const fillBtn = document.getElementById('fillBtn');
    const toggleGridBtn = document.getElementById('toggleGrid');
    const clearBtn = document.getElementById('clear');
    const pickBtn = document.getElementById('pickBtn');
    const invertBtn = document.getElementById('invert');
    const flipHBtn = document.getElementById('flipH');
    const flipVBtn = document.getElementById('flipV');

    const RECENT_KEY = 'pixelEditorRecentColors_v1';

    let res = parseInt(resSelect.value,10);
    let buffer = createBuffer(res);
    let tool = 'draw'; // draw | eraser | pick | pan | fill
    let drawing = false;
    let lastPos = null;
    let showGrid = true;

    // initialise
    function createBuffer(size){
      const arr = new Array(size*size).fill('#ffffff');
      return {w:size,h:size,data:arr};
    }

    function setRes(newRes){
      // scale existing image to new resolution
      const old = buffer;
      const newBuf = createBuffer(newRes);
      for(let y=0;y<newRes;y++){
        for(let x=0;x<newRes;x++){
          const sx = Math.floor(x * old.w / newRes);
          const sy = Math.floor(y * old.h / newRes);
          newBuf.data[y*newRes + x] = old.data[sy*old.w + sx] || '#ffffff';
        }
      }
      buffer = newBuf;
      res = newRes;
      curResLabel.textContent = `${res}x${res}`;
      drawDisplay();
    }

    function drawDisplay(){
      // draw pixels scaled to canvas size
      const size = display.width; // canvas is square
      const pxw = size / res;
      // clear
      ctx.clearRect(0,0,size,size);
      for(let y=0;y<res;y++){
        for(let x=0;x<res;x++){
          ctx.fillStyle = buffer.data[y*res + x] || '#ffffff';
          ctx.fillRect(Math.round(x*pxw), Math.round(y*pxw), Math.ceil(pxw), Math.ceil(pxw));
        }
      }
      if(showGrid){
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath();
        for(let i=0;i<=res;i++){
          const pos = Math.round(i*pxw)+0.5;
          ctx.moveTo(pos,0); ctx.lineTo(pos,size);
          ctx.moveTo(0,pos); ctx.lineTo(size,pos);
        }
        ctx.stroke();
      }
    }

    // map client coords to pixel coord
    function coordFromEvent(ev){
      const rect = display.getBoundingClientRect();
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
      const x = (clientX - rect.left) * (display.width / rect.width);
      const y = (clientY - rect.top) * (display.height / rect.height);
      const px = Math.floor( x / (display.width / res) );
      const py = Math.floor( y / (display.height / res) );
      return {x: Math.max(0, Math.min(res-1, px)), y: Math.max(0, Math.min(res-1, py))};
    }

    function setPixel(x,y,color){
      buffer.data[y*res + x] = color;
    }

    function drawLine(x0,y0,x1,y1,color){
      // Bresenham's line
      let dx = Math.abs(x1-x0), sx = x0<x1?1:-1;
      let dy = -Math.abs(y1-y0), sy = y0<y1?1:-1;
      let err = dx+dy;
      while(true){
        setPixel(x0,y0,color);
        if(x0===x1 && y0===y1) break;
        let e2 = 2*err;
        if(e2 >= dy){ err += dy; x0 += sx; }
        if(e2 <= dx){ err += dx; y0 += sy; }
      }
    }

    // flood fill
    function floodFill(sx,sy,targetColor,replaceColor){
      if(targetColor === replaceColor) return;
      const stack = [{x:sx,y:sy}];
      while(stack.length){
        const p = stack.pop();
        const idx = p.y*res + p.x;
        if(buffer.data[idx] !== targetColor) continue;
        buffer.data[idx] = replaceColor;
        if(p.x>0) stack.push({x:p.x-1,y:p.y});
        if(p.x<res-1) stack.push({x:p.x+1,y:p.y});
        if(p.y>0) stack.push({x:p.x,y:p.y-1});
        if(p.y<res-1) stack.push({x:p.x,y:p.y+1});
      }
    }

    // events
    display.addEventListener('mousedown', (e)=>{ if(e.button!==0) return; drawing=true; const p=coordFromEvent(e); handleDrawStart(p.x,p.y,e); });
    display.addEventListener('touchstart', (e)=>{ drawing=true; const p=coordFromEvent(e); handleDrawStart(p.x,p.y,e); e.preventDefault(); });
    window.addEventListener('mouseup', ()=>{ drawing=false; lastPos=null; });
    window.addEventListener('touchend', ()=>{ drawing=false; lastPos=null; });
    display.addEventListener('mousemove', (e)=>{ if(!drawing) return; const p=coordFromEvent(e); handleDrawMove(p.x,p.y,e); });
    display.addEventListener('touchmove', (e)=>{ if(!drawing) return; const p=coordFromEvent(e); handleDrawMove(p.x,p.y,e); e.preventDefault(); });

    function handleDrawStart(px,py,e){
      const color = (tool === 'eraser') ? '#ffffff' : picker.value;
      if(tool === 'fill'){
        const target = buffer.data[py*res + px];
        floodFill(px,py,target,color);
        pushRecent(color);
        drawDisplay();
        return;
      }
      if(tool === 'pick'){
        const c = buffer.data[py*res + px];
        if(c){ picker.value = c; hexInput.value = c; pushRecent(c); }
        drawDisplay();
        return;
      }
      setPixel(px,py,color);
      lastPos = {x:px,y:py};
      pushRecent(color);
      drawDisplay();
    }

    function handleDrawMove(px,py,e){
      const color = (tool === 'eraser') ? '#ffffff' : picker.value;
      if(lastPos && (e.shiftKey || e.touches && e.touches.length>0 && e.touches[0].shiftKey)){
        // draw straight line from lastPos to current
        drawLine(lastPos.x,lastPos.y,px,py,color);
      } else if(lastPos){
        // draw line for smoothness
        drawLine(lastPos.x,lastPos.y,px,py,color);
      } else {
        setPixel(px,py,color);
      }
      lastPos = {x:px,y:py};
      drawDisplay();
    }

    // controls
    resSelect.addEventListener('change', ()=>{ setRes(parseInt(resSelect.value,10)); });
    picker.addEventListener('input', ()=>{ hexInput.value = picker.value; });
    hexInput.addEventListener('change', ()=>{ const v = hexInput.value.trim(); if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)){ picker.value=v; } });

    eraserBtn.addEventListener('click', ()=>{ tool = (tool === 'eraser') ? 'draw' : 'eraser'; eraserBtn.textContent = (tool==='eraser')? 'drawing' : 'eraser'; });
    fillBtn.addEventListener('click', ()=>{ tool = (tool === 'fill') ? 'draw' : 'fill'; fillBtn.style.borderColor = (tool==='fill')? 'var(--accent)': ''; });
    toggleGridBtn.addEventListener('click', ()=>{ showGrid = !showGrid; drawDisplay(); });
    clearBtn.addEventListener('click', ()=>{ buffer = createBuffer(res); drawDisplay(); });
    pickBtn.addEventListener('click', ()=>{ tool = (tool==='pick')? 'draw' : 'pick'; pickBtn.style.borderColor = (tool==='pick')? 'var(--accent)': ''; });

    invertBtn.addEventListener('click', ()=>{
      for(let i=0;i<buffer.data.length;i++){
        const c = buffer.data[i];
        buffer.data[i] = invertHex(c);
      }
      drawDisplay();
    });
    flipHBtn.addEventListener('click', ()=>{
      const newBuf = createBuffer(res);
      for(let y=0;y<res;y++) for(let x=0;x<res;x++) newBuf.data[y*res + x] = buffer.data[y*res + (res-1-x)];
      buffer = newBuf; drawDisplay();
    });
    flipVBtn.addEventListener('click', ()=>{
      const newBuf = createBuffer(res);
      for(let y=0;y<res;y++) for(let x=0;x<res;x++) newBuf.data[y*res + x] = buffer.data[(res-1-y)*res + x];
      buffer = newBuf; drawDisplay();
    });

    function invertHex(hex){
      // assume #rrggbb
      if(!/^#([0-9a-fA-F]{6})$/.test(hex)) return hex;
      const r = 255 - parseInt(hex.substr(1,2),16);
      const g = 255 - parseInt(hex.substr(3,2),16);
      const b = 255 - parseInt(hex.substr(5,2),16);
      return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
    }

    // recent colors
    function loadRecent(){
      try{ const raw = localStorage.getItem(RECENT_KEY); if(raw){ return JSON.parse(raw); } }catch(e){}
      return [];
    }
    function saveRecent(arr){ localStorage.setItem(RECENT_KEY, JSON.stringify(arr.slice(0,10))); }
    function pushRecent(col){
      if(!col) return;
      let arr = loadRecent();
      arr = arr.filter(c=>c.toLowerCase()!==col.toLowerCase());
      arr.unshift(col);
      arr = arr.slice(0,10);
      saveRecent(arr);
      renderRecent();
    }
    function renderRecent(){
      const arr = loadRecent();
      recentColorsWrap.innerHTML='';
      arr.forEach(c=>{
        const el = document.createElement('div'); el.className='swatch'; el.style.background=c; el.title=c;
        el.addEventListener('click', ()=>{ picker.value = c; hexInput.value = c; pushRecent(c); });
        recentColorsWrap.appendChild(el);
      });
      // add a + swatch that opens color picker
      const add = document.createElement('div'); 
      add.className='swatch';
      add.style.display='flex'; 
      add.style.alignItems='center'; 
      add.style.justifyContent='center'; 
      add.style.fontSize='12px'; 
      add.style.color='rgba(255,255,255,0.6)'; 
      add.textContent='+';
      add.title='add new color'; 
      add.addEventListener('click', ()=>{ picker.click(); });
      recentColorsWrap.appendChild(add);

      // when picker changes, push to recent
      picker.onchange = ()=>{ hexInput.value = picker.value; pushRecent(picker.value); };
    }

    // download (more reliable)
    downloadBtn.addEventListener('click', ()=>{
      const outSize = parseInt(exportSize.value,10);
      const tmp = document.createElement('canvas');
      tmp.width = outSize; tmp.height = outSize;
      const tctx = tmp.getContext('2d');

      const pxw = outSize / res;
      for(let y=0;y<res;y++){
        for(let x=0;x<res;x++){
          tctx.fillStyle = buffer.data[y*res + x] || '#ffffff';
          tctx.fillRect(Math.floor(x*pxw), Math.floor(y*pxw), Math.ceil(pxw), Math.ceil(pxw));
        }
      }

      const dataURL = tmp.toDataURL('image/png');
      const name = (filenameInput.value || 'pixel-art').replace(/[^a-z0-9-_\.]/gi,'') + '.png';

      const a = document.createElement('a');
      a.href = dataURL;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // import/export palette (very simple): paste comma separated hex
    document.getElementById('importPalette').addEventListener('click', ()=>{
      const val = prompt('paste comma separated hex colors (eg: #ff0000,#00ff00)');
      if(!val) return; const parts = val.split(',').map(s=>s.trim()).filter(Boolean).slice(0,10);
      parts.forEach(p=>{ if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(p)) pushRecent(p); });
    });

    // init
    renderRecent();
    drawDisplay();

    // resize canvas display to keep crisp pixels
    function resizeCanvas(){
      const dpi = window.devicePixelRatio || 1;
      const cssSize = Math.min(680-40, 512);
      display.style.width = cssSize + 'px';
      display.style.height = cssSize + 'px';
      display.width = Math.round(cssSize * dpi);
      display.height = Math.round(cssSize * dpi);
      drawDisplay();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

  </script>
</body>
</html>
