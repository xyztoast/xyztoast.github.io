<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>loafAI chat</title>
  <style>
    body { font-family: sans-serif; background: #212425; color: #fff; padding: 2rem; }
    #chat { max-width: 500px; margin: auto; }
    textarea { width: 100%; height: 80px; background: #323738; color: #fff; border: none; padding: 0.5rem; }
    button { background: #00b2ff; border: none; padding: 0.5rem 1rem; color: #212425; cursor: pointer; margin-top: 0.5rem; }
    pre { background: #323738; padding: 1rem; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <div id="chat">
    <textarea id="input" placeholder="Say something..."></textarea>
    <button onclick="send()">Send</button>
    <pre id="output"></pre>
  </div>

  <script>
    const API_KEY = "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"; // paste your loafAI key here

    async function send() {
      const msg = document.getElementById("input").value;

      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + API_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "openrouter/auto",
          messages: [{ role: "user", content: msg }]
        })
      });

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || "no reply";
      document.getElementById("output").textContent += "\n\nYou: " + msg + "\nAI: " + reply;
      document.getElementById("input").value = "";
    }
  </script>
</body>
</html>
