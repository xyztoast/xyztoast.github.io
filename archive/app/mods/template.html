  <title>idktoast mods</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:'Roboto', sans-serif;
      background: #212425;
      color:#00b2ff
    }
    .wrap{
      height:100%;
      display:flex;
     
      flex-direction:column;
      align-items:center;
      justify-content:top;
      gap:16px;
      text-align:center;
    }
    h1{
      font-weight:700;
      margin:0;
      font-size:80px;
    }
    h2{
      color: #f5f5f5;
      margin:0;
      font-size:25px;
      padding-top: 80px;
      text-align: center;
    }
    p{
      color: #bebebe;
      font-weight: 100;
      margin: 0;
      font-size:17.5px;
      padding-top: 40px;
      margin-left: 10px;
      margin-right: 10px;
      text-align: center;
    }

    a{
      color:#00b2ff;
      text-decoration:none;
      font-weight: 550;
      padding:6px 5px;
      border-radius:6px;
    }

    .beta-btn {
    position: fixed;
    bottom: 15px;
    left: 60px;
    display: inline-flex;
    align-items: left;
    gap: 8px;
    padding: 12px 12px;
    text-decoration: none;
    color: #bebebe;
    font-size: 18px
    }

     .unreleased-btn {
    position: fixed;
    bottom: 15px;
    right: 100px;
    display: inline-flex;
    align-items: right;
    gap: 8px;
    padding: 12px 12px;
    text-decoration: none;
    color: #bebebe;
    font-size: 18px
    }
    
    .footer-panel {
      position: fixed;
      align-items: center;
      left: 0px;
      bottom: 0px;
      width: 100vw;
      background: rgba(33, 36, 37, 0.6);
      padding: 35px;
      text-color: #323738;
      font-size: 10px;
      backdrop-filter: blur(3px);
      margin-top: 10px;
    }
    .back {
      border-radius: 20px;
      height: 50px;
      width: 50px;
      background-color: #32373880;
      backdrop-filter: blur(3px);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
      margin-left: 10px;
    }
    .header-panel {
      position: fixed;
      place-items: center;
      margin: auto;
      left: 0px;
      top: 0px;
      background-color: rgba(33, 36, 37, 0.7);
      text-color: #00b2ff;
      width: 100vw;
      text-align: center;
      font-size: 40px;
      height: 45px;
      backdrop-filter: blur(3px);
    }
  </style>
</head>
<body>
  </div>

  </a> 
  <div class="footer-panel">
  </div>
    <div class="header-panel">
  </div>

  </a> 
  <a class="unreleased-btn" href="https://xyztoast.github.io/app/unreleased">unreleased</a>
