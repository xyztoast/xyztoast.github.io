  </div>
  <div class="spacing" style="padding-top: 5%;">

<div class="form">
<h2>if only this was a mod...</h2>
<p>drop your mod ideas here</p>
<form>
<textarea id="idea" placeholder="what if you made a..." required></textarea>
<div class="spacing" style="padding: 2px;"></div>
    <div class="mod-ideas">
<textarea id="name" placeholder="name" maxlength="20" required></textarea>
<button id="submit" type="submit" class="submit">submit</button>
    </div>
</form>
    
  <div class="spacing" style="padding-top: 200px;">
  <h2>other ideas</h2>
  <p>more ideas made by other people</p>
    
      </div>
    </div>
<div class="spacing"/>

    <div class="idea-post">
      <div id="name" class="username">username</div>
      <br>
      <div id="idea" class="idea">cool mod idea made by a person</div>
      <br>
      <div style="display: flex; justify-content: right;">
        <input type="checkbox" id="upvote" class="check_box"/>
        <label for="upvote"></label>
      </div>
      </div>
    
    
    
    
    
    </div>
<div class="spacing"/>

<div id="ideas-container">
  </div>

<script>
const API_URL = "https://ideas-idktoast.vercel.app/api/send"; // Use your actual Worker URL
const submitBtn = document.querySelector("#submit");
const ideaText = document.querySelector("#idea");
const nameInput = document.querySelector("#name");

// 1. Load ideas from DB
async function loadIdeas() {
  const container = document.getElementById("ideas-container");
  try {
    const res = await fetch(API_URL);
    const ideas = await res.json();
    
    container.innerHTML = ideas.map(post => `
      <div class="idea-post" style="margin-bottom: 10px;">
        <div class="username">${escapeHTML(post.name)}</div>
        <div class="idea">${escapeHTML(post.idea)}</div>
        <div style="display: flex; justify-content: right; align-items: center; gap: 8px;">
          <span id="count-${post.id}">${post.upvotes}</span>
          <input type="checkbox" id="upvote-${post.id}" class="check_box" onchange="handleUpvote(${post.id}, this)"/>
          <label for="upvote-${post.id}"></label>
        </div>
      </div>
    `).join('');
  } catch (err) {
    console.error("Load error:", err);
  }
}

// 2. Handle Upvoting
async function handleUpvote(id, checkbox) {
  if (!checkbox.checked) return; // Only allow adding likes for now
  
  try {
    await fetch(API_URL, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id })
    });
    
    // Update the UI number immediately
    const countSpan = document.getElementById(`count-${id}`);
    countSpan.textContent = parseInt(countSpan.textContent) + 1;
    checkbox.disabled = true; // Prevent double-liking
  } catch (err) {
    console.error("Upvote failed:", err);
  }
}

// 3. Submit new idea
submitBtn.addEventListener("click", async (e) => {
  e.preventDefault();
  const idea = ideaText.value.trim();
  const name = nameInput.value.trim() || "anonymous";

  if (!idea) return;

  await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ idea, name })
  });

  ideaText.value = "";
  loadIdeas(); // Refresh the list
});

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Initial Load
loadIdeas();
</script>
