<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="https://hello.mcbcode.com/theme.css">
  <meta charset="utf-8" />
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ideas</title>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      font-family: 'mcfont', sans-serif;
      background: #212425;
      font-weight: 0;
      color: #bebebe;
    }
    h2 { font-size: 25px; }
    a {
      color: #00b2ff;
      text-decoration: none;
      padding: 8px;
      white-space: nowrap;
      background-color: #323738;
      transition: background-color 0.1s ease-in-out, padding 0.1s ease-in-out;
    }
    a:hover { background-color: #44494a; color: #5acaff; padding: 8px 26px; }
    p { padding: 6px; }

    .form { margin-left: 5%; margin-right: 5%; text-align: center; }
    textarea {
      resize: none; outline: none; border: none;
      font-size: 16px; height: 100px; font-family: mcfont;
      background-color: #323738; color: #ffffff;
      width: 100%; padding: 8px; box-sizing: border-box;
    }
    .mod-ideas { display: flex; width: 100%; gap: 8px; margin-top: 8px; }
    #name-input { flex: 1; height: 40px; }
    .submit {
      background-color: #00b2ff; color: #000; font-size: 16px;
      padding: 8px 20px; user-select: none; border: none; cursor: pointer;
      transition: background-color 0.1s;
    }
    .submit:hover { background-color: #5acaff; }

    .sort-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
    .sort-btn {
      background: #323738; color: #6b7172; border: none;
      font-family: mcfont; font-size: 13px; padding: 5px 12px;
      cursor: pointer; transition: color 0.1s, background 0.1s;
    }
    .sort-btn:hover { color: #bebebe; }
    .sort-btn.active { color: #00b2ff; background: #2a3a40; }

    #ideas-container { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }

    .idea-post {
      background-color: #323738;
      margin-left: 1%; margin-right: 1%;
      padding: 16px; text-align: left;
      border-left: 4px solid #00b2ff;
      transition: border-color 0.2s ease;
    }
    .idea-post.mega {
      border-left-color: #05ee93;
      background-color: #05ee93;
    }
    .idea-post.mega * { color: #212425 !important; }
    .idea-post.mega .upvote-arrow { border-bottom-color: #212425 !important; }
    .idea-post.mega .upvote-label.voted .upvote-arrow { border-bottom-color: #212425 !important; }
    .idea-post.mega .mega-arrow { border-bottom-color: #212425 !important; }
    .idea-post.mega .mega-label.voted .mega-arrow { border-bottom-color: #212425 !important; }
    .idea-post.mega .mod-response { background: #04c97a; border-left-color: #212425; }
    .idea-post.mega .response-input { background: #04c97a; color: #212425; }

    .idea-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
    .idea-num { color: #00b2ff; font-family: mcfontb; }
    .idea-username { color: #00b2ff; font-family: mcfontb; }
    .idea-date { color: #6b7172; font-size: 12px; }
    .idea-text { margin-top: 8px; color: #ebebeb; word-wrap: break-word; }

    .read-more {
      background: none; border: none; font-family: mcfont;
      font-size: 12px; color: #6b7172; cursor: pointer;
      padding: 4px 0 0 0; display: block; transition: color 0.1s;
    }
    .read-more:hover { color: #00b2ff; }

    .idea-footer { margin-top: 10px; display: flex; align-items: center; gap: 14px; }

    .upvote-label {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none; font-size: 13px;
      color: #6b7172; transition: color 0.1s;
    }
    .upvote-label:hover { color: #bebebe; }
    .upvote-label:hover .upvote-arrow { border-bottom-color: #bebebe; }
    .upvote-arrow {
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid #6b7172;
      flex-shrink: 0;
      transition: border-bottom-color 0.1s;
    }
    .upvote-label.voted { color: #00b2ff; }
    .upvote-label.voted .upvote-arrow { border-bottom-color: #00b2ff; }

    .mega-label {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none; font-size: 13px;
      color: #6b7172; transition: color 0.1s;
    }
    .mega-label:hover { color: #05ee93; }
    .mega-label:hover .mega-arrow { border-bottom-color: #05ee93; }
    .mega-arrow {
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid #6b7172;
      flex-shrink: 0;
      transition: border-bottom-color 0.1s;
    }
    .mega-label.voted { color: #05ee93; }
    .mega-label.voted .mega-arrow { border-bottom-color: #05ee93; }

    .mega-credit { font-size: 12px; color: #6b7172; margin-top: 6px; }

    .mod-response {
      margin-top: 12px; padding: 10px 12px;
      background: #212425; border-left: 3px solid #00b2ff;
    }
    .mod-response-header { font-size: 12px; color: #00b2ff; font-family: mcfontb; margin-bottom: 4px; }
    .mod-response-text { font-size: 13px; color: #bebebe; word-wrap: break-word; }

    .response-input-wrap { margin-top: 10px; display: flex; gap: 6px; }
    .response-input {
      flex: 1; background: #212425; border: none; outline: none;
      font-family: mcfont; font-size: 13px; color: #fff;
      padding: 6px 8px; resize: none; height: 32px; box-sizing: border-box;
    }
    .response-submit {
      background: #00b2ff; color: #000; border: none;
      font-family: mcfont; font-size: 12px; padding: 0 10px;
      cursor: pointer; transition: background 0.1s; white-space: nowrap;
    }
    .response-submit:hover { background: #5acaff; }

    .spacing { padding-top: 50px; }

    #muv-btn {
      position: fixed; bottom: 14px; right: 14px;
      width: 18px; height: 18px;
      background: #2a2e2f; border: 1px solid #383d3e;
      cursor: pointer; opacity: 0.35; transition: opacity 0.15s; z-index: 100;
    }
    #muv-btn:hover { opacity: 0.7; }

    #muv-modal {
      display: none; position: fixed; inset: 0;
      background: #000000aa; z-index: 200;
      align-items: center; justify-content: center;
    }
    #muv-modal.open { display: flex; }
    #muv-box {
      background: #212425; border: 1px solid #383d3e;
      padding: 20px; width: 280px;
      display: flex; flex-direction: column; gap: 10px;
    }
    #muv-box p { padding: 0; margin: 0; font-size: 13px; color: #6b7172; }
    #muv-input {
      height: 36px; font-size: 14px; width: 100%; box-sizing: border-box;
      background: #323738; border: none; outline: none;
      color: #fff; font-family: mcfont; padding: 6px 8px; letter-spacing: 3px;
    }
    #muv-submit {
      background: #00b2ff; color: #000; border: none;
      font-family: mcfont; font-size: 14px; padding: 7px 0;
      cursor: pointer; transition: background 0.1s;
    }
    #muv-submit:hover { background: #5acaff; }
    #muv-submit.active-mode { background: #05ee93; }
    #muv-error { color: #ff4444; font-size: 12px; min-height: 14px; }
    #muv-close {
      align-self: flex-end; background: none; border: none;
      color: #6b7172; font-size: 18px; cursor: pointer; line-height: 1; padding: 0;
    }
  </style>
</head>
<body>

  <div style="padding-top: 5%;">
    <div class="form">
      <h2>if only this was a mod...</h2>
      <p>drop your mod ideas here</p>

      <form id="mod-form">
        <textarea id="idea-input" placeholder="what if you made a..." required></textarea>
        <div class="mod-ideas">
          <textarea id="name-input" placeholder="name" maxlength="20"></textarea>
          <button type="submit" class="submit">submit</button>
        </div>
        <div id="form-message"></div>
      </form>

      <div class="spacing">
        <h2>other ideas</h2>
        <p>more ideas made by other people</p>
      </div>

      <div class="sort-bar">
        <button class="sort-btn active" data-sort="newest">newest</button>
        <button class="sort-btn" data-sort="oldest">oldest</button>
        <button class="sort-btn" data-sort="most">most upvotes</button>
        <button class="sort-btn" data-sort="least">least upvotes</button>
      </div>

      <div id="ideas-container"><p>loading ideas...</p></div>
    </div>
  </div>
  <br><br><br><br><br>

  <div id="muv-btn"></div>

  <div id="muv-modal">
    <div id="muv-box">
      <button id="muv-close">x</button>
      <p>enter secret to enable mega upvotes + responses</p>
      <input id="muv-input" type="password" placeholder="secret" autocomplete="off" />
      <div id="muv-error"></div>
      <button id="muv-submit">unlock</button>
    </div>
  </div>

  <script>
    const API_URL = "https://ideas-hello.mcbcode.com";
    const CHAR_LIMIT = 750;

    const form = document.querySelector("#mod-form");
    const ideaInput = document.querySelector("#idea-input");
    const nameInput = document.querySelector("#name-input");
    const formMessage = document.querySelector("#form-message");
    const ideasContainer = document.querySelector("#ideas-container");
    const muvBtn = document.querySelector("#muv-btn");
    const muvModal = document.querySelector("#muv-modal");
    const muvClose = document.querySelector("#muv-close");
    const muvInput = document.querySelector("#muv-input");
    const muvSubmit = document.querySelector("#muv-submit");
    const muvError = document.querySelector("#muv-error");

    let muvSecret = null;
    let allIdeas = [];
    let currentSort = "newest";

    function getVoted() {
      try { return JSON.parse(localStorage.getItem("voted_ideas") || "[]"); } catch { return []; }
    }
    function markVoted(id) {
      const v = getVoted();
      if (!v.includes(String(id))) v.push(String(id));
      localStorage.setItem("voted_ideas", JSON.stringify(v));
    }
    function unmarkVoted(id) {
      localStorage.setItem("voted_ideas", JSON.stringify(getVoted().filter(x => x !== String(id))));
    }

    // muv modal
    muvBtn.addEventListener("click", () => muvModal.classList.add("open"));
    muvClose.addEventListener("click", closeModal);
    muvModal.addEventListener("click", (e) => { if (e.target === muvModal) closeModal(); });
    function closeModal() { muvModal.classList.remove("open"); muvError.textContent = ""; muvInput.value = ""; }

    muvSubmit.addEventListener("click", async () => {
      if (muvSubmit.classList.contains("active-mode")) {
        muvSecret = null;
        muvSubmit.classList.remove("active-mode");
        muvSubmit.textContent = "unlock";
        closeModal();
        renderIdeas();
        return;
      }
      const val = muvInput.value;
      if (!val) { muvError.textContent = "enter the secret"; return; }
      try {
        const res = await fetch(API_URL, {
          method: "PATCH",
          headers: { "Content-Type": "application/json", "X-MUV-Secret": val },
          body: JSON.stringify({ id: 0, type: "mega_check" })
        });
        if (res.status === 403) { muvError.textContent = "wrong secret"; return; }
        muvSecret = val;
        muvSubmit.classList.add("active-mode");
        muvSubmit.textContent = "disable";
        muvError.textContent = "";
        closeModal();
        renderIdeas();
      } catch { muvError.textContent = "network error"; }
    });

    // sort
    document.querySelectorAll(".sort-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSort = btn.dataset.sort;
        renderIdeas();
      });
    });

    function getSorted(ideas) {
      const copy = [...ideas];
      if (currentSort === "newest") return copy.sort((a, b) => b.ideaNumber - a.ideaNumber);
      if (currentSort === "oldest") return copy.sort((a, b) => a.ideaNumber - b.ideaNumber);
      if (currentSort === "most") return copy.sort((a, b) => (b.upvotes || 0) - (a.upvotes || 0));
      if (currentSort === "least") return copy.sort((a, b) => (a.upvotes || 0) - (b.upvotes || 0));
      return copy;
    }

    function formatDate(ts) {
      if (!ts) return "";
      const d = new Date(ts.includes("T") ? ts : ts + "Z");
      if (isNaN(d)) return "";
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return months[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear();
    }

    function escapeHTML(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function buildCard(post) {
      const isMega = post.mega_upvoted === 1;
      const hasVoted = getVoted().includes(String(post.ideaNumber));
      const isLong = post.idea && post.idea.length > CHAR_LIMIT;

      const div = document.createElement("div");
      div.className = "idea-post" + (isMega ? " mega" : "");

      // meta
      const meta = document.createElement("div");
      meta.className = "idea-meta";
      meta.innerHTML =
        '<span class="idea-num">#' + post.ideaNumber + '</span>' +
        '<span style="color:#6b7172">|</span>' +
        '<span class="idea-username">' + escapeHTML(post.name || "anonymous") + '</span>' +
        '<span style="color:#6b7172">|</span>' +
        '<span class="idea-date">' + formatDate(post.timestamp) + '</span>';
      div.appendChild(meta);

      // text
      const textEl = document.createElement("div");
      textEl.className = "idea-text";
      textEl.textContent = isLong ? post.idea.slice(0, CHAR_LIMIT) + "..." : post.idea;
      div.appendChild(textEl);

      // read more
      if (isLong) {
        let expanded = false;
        const readMore = document.createElement("button");
        readMore.className = "read-more";
        readMore.textContent = "read more >";
        readMore.addEventListener("click", () => {
          expanded = !expanded;
          textEl.textContent = expanded ? post.idea : post.idea.slice(0, CHAR_LIMIT) + "...";
          readMore.textContent = expanded ? "< read less" : "read more >";
        });
        div.appendChild(readMore);
      }

      // footer
      const footer = document.createElement("div");
      footer.className = "idea-footer";

      // upvote
      const upvoteLabel = document.createElement("div");
      upvoteLabel.className = "upvote-label" + (hasVoted ? " voted" : "");
      const upvoteArrow = document.createElement("span");
      upvoteArrow.className = "upvote-arrow";
      const upvoteCount = document.createElement("span");
      upvoteCount.textContent = post.upvotes || 0;
      upvoteLabel.appendChild(upvoteArrow);
      upvoteLabel.appendChild(upvoteCount);

      let isVoted = hasVoted;
      upvoteLabel.addEventListener("click", async () => {
        if (isVoted) {
          isVoted = false;
          upvoteLabel.classList.remove("voted");
          upvoteCount.textContent = Math.max(0, parseInt(upvoteCount.textContent) - 1);
          post.upvotes = Math.max(0, (post.upvotes || 0) - 1);
          unmarkVoted(post.ideaNumber);
          try { await fetch(API_URL, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: post.ideaNumber, type: "unvote" }) }); } catch {}
        } else {
          isVoted = true;
          upvoteLabel.classList.add("voted");
          upvoteCount.textContent = parseInt(upvoteCount.textContent) + 1;
          post.upvotes = (post.upvotes || 0) + 1;
          markVoted(post.ideaNumber);
          try { await fetch(API_URL, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: post.ideaNumber, type: "upvote" }) }); } catch {}
        }
      });
      footer.appendChild(upvoteLabel);

      // mega upvote (muv mode only)
      if (muvSecret) {
        const megaLabel = document.createElement("div");
        megaLabel.className = "mega-label" + (isMega ? " voted" : "");
        const megaArrow = document.createElement("span");
        megaArrow.className = "mega-arrow";
        const megaText = document.createElement("span");
        megaText.textContent = "mega";
        megaLabel.appendChild(megaArrow);
        megaLabel.appendChild(megaText);
        if (!isMega) {
          megaLabel.addEventListener("click", async () => {
            megaLabel.classList.add("voted");
            div.classList.add("mega");
            megaLabel.style.pointerEvents = "none";
            post.mega_upvoted = 1;
            const creditEl = div.querySelector(".mega-credit");
            if (creditEl) creditEl.style.display = "block";
            try { await fetch(API_URL, { method: "PATCH", headers: { "Content-Type": "application/json", "X-MUV-Secret": muvSecret }, body: JSON.stringify({ id: post.ideaNumber, type: "mega" }) }); } catch {}
          });
        } else {
          megaLabel.style.pointerEvents = "none";
        }
        footer.appendChild(megaLabel);
      }

      div.appendChild(footer);

      // mega credit
      if (isMega) {
        const credit = document.createElement("div");
        credit.className = "mega-credit";
        credit.textContent = "(This idea was upvoted by idktoast)";
        div.appendChild(credit);
      }

      // mod response display
      if (post.response) {
        const respWrap = document.createElement("div");
        respWrap.className = "mod-response";
        const respHeader = document.createElement("div");
        respHeader.className = "mod-response-header";
        respHeader.textContent = "idktoast";
        const respText = document.createElement("div");
        respText.className = "mod-response-text";
        respText.textContent = post.response;
        respWrap.appendChild(respHeader);
        respWrap.appendChild(respText);
        div.appendChild(respWrap);
      }

      // mod response input (muv mode only)
      if (muvSecret) {
        const respWrap = document.createElement("div");
        respWrap.className = "response-input-wrap";
        const respInput = document.createElement("textarea");
        respInput.className = "response-input";
        respInput.placeholder = post.response ? "edit response..." : "add response...";
        respInput.value = post.response || "";
        const respBtn = document.createElement("button");
        respBtn.className = "response-submit";
        respBtn.textContent = "save";
        respBtn.addEventListener("click", async () => {
          const txt = respInput.value.trim();
          try {
            const res = await fetch(API_URL, {
              method: "PATCH",
              headers: { "Content-Type": "application/json", "X-MUV-Secret": muvSecret },
              body: JSON.stringify({ id: post.ideaNumber, type: "respond", response: txt })
            });
            const data = await res.json();
            if (data.success) {
              post.response = txt || null;
              div.replaceWith(buildCard(post));
            }
          } catch {}
        });
        respWrap.appendChild(respInput);
        respWrap.appendChild(respBtn);
        div.appendChild(respWrap);
      }

      return div;
    }

    function renderIdeas() {
      if (!allIdeas.length) { ideasContainer.innerHTML = "<p>no ideas yet. be the first!</p>"; return; }
      ideasContainer.innerHTML = "";
      getSorted(allIdeas).forEach(post => ideasContainer.appendChild(buildCard(post)));
    }

    async function loadIdeas() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("fetch failed");
        allIdeas = await res.json();
        renderIdeas();
      } catch (err) {
        console.error(err);
        ideasContainer.innerHTML = "<p>error loading ideas.</p>";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const idea = ideaInput.value.trim();
      const name = nameInput.value.trim() || "anonymous";
      if (!idea) return;
      formMessage.style.color = "#fff";
      formMessage.textContent = "submitting...";
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idea, name })
        });
        const data = await res.json();
        if (data.success) {
          formMessage.innerHTML = "<br>idea submitted!";
          ideaInput.value = "";
          nameInput.value = "";
          loadIdeas();
        } else { formMessage.textContent = "oops, something went wrong!"; }
      } catch { formMessage.textContent = "network error"; }
    });

    loadIdeas();
  </script>

  <script data-goatcounter="https://idktoast.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
