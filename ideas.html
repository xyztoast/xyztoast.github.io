<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="https://hello.mcbcode.com/theme.css">
  <meta charset="utf-8" />
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ideas</title>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      font-family: 'mcfont', sans-serif;
      background: #212425;
      font-weight: 0;
      color: #bebebe;
    }
    h2 { font-size: 25px; }
    a {
      color: #00b2ff;
      text-decoration: none;
      padding: 8px 8px;
      white-space: nowrap;
      background-color: #323738;
      transition: background-color 0.1s ease-in-out, padding 0.1s ease-in-out;
    }
    a:hover {
      background-color: #44494a;
      color: #5acaff;
      padding: 8px 26px;
    }
    p { padding: 6px; }

    .form {
      margin-left: 5%;
      margin-right: 5%;
      text-align: center;
    }
    textarea {
      resize: none;
      outline: none;
      border: none;
      font-size: 16px;
      height: 100px;
      font-family: mcfont;
      background-color: #323738;
      color: #ffffff;
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .mod-ideas {
      display: flex;
      width: 100%;
      gap: 8px;
      margin-top: 8px;
    }
    #name-input {
      flex: 1;
      height: 40px;
    }
    .submit {
      background-color: #00b2ff;
      color: #000000;
      font-size: 16px;
      padding: 8px 20px;
      user-select: none;
      border: none;
      cursor: pointer;
      transition: background-color 0.1s ease-in-out;
    }
    .submit:hover { background-color: #5acaff; }

    #ideas-container {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .idea-post {
      background-color: #323738;
      margin-left: 1%;
      margin-right: 1%;
      padding: 16px;
      text-align: left;
      border-left: 4px solid #00b2ff;
      transition: border-color 0.2s ease;
    }
    .idea-post.mega {
      border-left-color: #05ee93;
    }
    .idea-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .idea-num {
      color: #00b2ff;
      font-family: mcfontb;
    }
    .idea-post.mega .idea-num {
      color: #05ee93;
    }
    .idea-username {
      color: #00b2ff;
      font-family: mcfontb;
    }
    .idea-post.mega .idea-username {
      color: #05ee93;
    }
    .idea-date {
      color: #6b7172;
      font-size: 12px;
    }
    .idea-text {
      margin-top: 8px;
      color: #ebebeb;
      word-wrap: break-word;
    }
    .idea-footer {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .upvote-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: #6b7172;
      transition: color 0.1s;
    }
    .upvote-label:hover { color: #bebebe; }
    .upvote-label input[type="checkbox"] { display: none; }
    .upvote-box {
      width: 16px;
      height: 16px;
      border: 1px solid #6b7172;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.1s, background 0.1s;
    }
    .upvote-label.voted .upvote-box {
      border-color: #00b2ff;
      background: #00b2ff22;
    }
    .upvote-label.voted { color: #00b2ff; }
    .upvote-label.voted .upvote-box::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #00b2ff;
      display: block;
    }

    .mega-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: #6b7172;
      transition: color 0.1s;
    }
    .mega-label:hover { color: #05ee93; }
    .mega-label input[type="checkbox"] { display: none; }
    .mega-box {
      width: 16px;
      height: 16px;
      border: 1px solid #05ee93;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.1s;
    }
    .mega-label.voted { color: #05ee93; }
    .mega-label.voted .mega-box {
      background: #05ee9322;
    }
    .mega-label.voted .mega-box::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #05ee93;
      display: block;
    }
    .mega-credit {
      font-size: 12px;
      color: #6b7172;
      margin-top: 6px;
    }
    .spacing { padding-top: 50px; }
  </style>
</head>
<body>

  <div style="padding-top: 5%;">
    <div class="form">
      <h2>if only this was a mod...</h2>
      <p>drop your mod ideas here</p>

      <form id="mod-form">
        <textarea id="idea-input" placeholder="what if you made a..." required></textarea>
        <div class="mod-ideas">
          <textarea id="name-input" placeholder="name" maxlength="20"></textarea>
          <button type="submit" class="submit">submit</button>
        </div>
        <div id="form-message"></div>
      </form>

      <div class="spacing">
        <h2>other ideas</h2>
        <p>more ideas made by other people</p>
      </div>

      <div id="ideas-container">
        <p>loading ideas...</p>
      </div>
    </div>
  </div>
  <br><br><br><br><br>

  <script>
    const API_URL = "https://ideas-hello.mcbcode.com";

    const form = document.querySelector("#mod-form");
    const ideaInput = document.querySelector("#idea-input");
    const nameInput = document.querySelector("#name-input");
    const formMessage = document.querySelector("#form-message");
    const ideasContainer = document.querySelector("#ideas-container");

    function getVoted() {
      try { return JSON.parse(localStorage.getItem("voted_ideas") || "[]"); }
      catch { return []; }
    }
    function markVoted(id) {
      const v = getVoted();
      if (!v.includes(String(id))) v.push(String(id));
      localStorage.setItem("voted_ideas", JSON.stringify(v));
    }
    function getMegaVoted() {
      try { return JSON.parse(localStorage.getItem("mega_voted_ideas") || "[]"); }
      catch { return []; }
    }
    function markMegaVoted(id) {
      const v = getMegaVoted();
      if (!v.includes(String(id))) v.push(String(id));
      localStorage.setItem("mega_voted_ideas", JSON.stringify(v));
    }

    function isMuvMode() {
      const i = ideaInput.value;
      const n = nameInput.value;
      return i.length > 0 && n.length > 0 && i === n;
    }

    function formatDate(ts) {
      if (!ts) return "";
      const d = new Date(ts.includes("T") ? ts : ts + "Z");
      if (isNaN(d)) return "";
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return months[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear();
    }

    async function loadIdeas() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("fetch failed");
        const ideas = await res.json();

        if (!ideas.length) {
          ideasContainer.innerHTML = "<p>no ideas yet. be the first!</p>";
          return;
        }

        const voted = getVoted();
        const megaVoted = getMegaVoted();
        const muvMode = isMuvMode();

        ideasContainer.innerHTML = "";

        ideas.forEach((post, index) => {
          const isMega = post.mega_upvoted === 1;
          const hasVoted = voted.includes(String(post.ideaNumber));
          const hasMegaVoted = megaVoted.includes(String(post.ideaNumber));
          const num = ideas.length - index;

          const div = document.createElement("div");
          div.className = "idea-post" + (isMega ? " mega" : "");

          const meta = document.createElement("div");
          meta.className = "idea-meta";
          meta.innerHTML =
            '<span class="idea-num">#' + num + '</span>' +
            '<span style="color:#6b7172">|</span>' +
            '<span class="idea-username">' + escapeHTML(post.name || "anonymous") + '</span>' +
            '<span style="color:#6b7172">|</span>' +
            '<span class="idea-date">' + formatDate(post.timestamp) + '</span>';

          const textEl = document.createElement("div");
          textEl.className = "idea-text";
          textEl.textContent = post.idea;

          const footer = document.createElement("div");
          footer.className = "idea-footer";

          // regular upvote
          const upvoteLabel = document.createElement("label");
          upvoteLabel.className = "upvote-label" + (hasVoted ? " voted" : "");

          const upvoteChk = document.createElement("input");
          upvoteChk.type = "checkbox";
          upvoteChk.checked = hasVoted;

          const upvoteBox = document.createElement("span");
          upvoteBox.className = "upvote-box";

          const upvoteCount = document.createElement("span");
          upvoteCount.textContent = post.upvotes || 0;

          upvoteLabel.appendChild(upvoteChk);
          upvoteLabel.appendChild(upvoteBox);
          upvoteLabel.appendChild(upvoteCount);

          if (!hasVoted) {
            upvoteLabel.addEventListener("click", async () => {
              upvoteLabel.classList.add("voted");
              upvoteCount.textContent = parseInt(upvoteCount.textContent) + 1;
              markVoted(post.ideaNumber);
              upvoteLabel.style.pointerEvents = "none";
              try {
                await fetch(API_URL, {
                  method: "PATCH",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ id: post.ideaNumber, type: "upvote" })
                });
              } catch {}
            });
          } else {
            upvoteLabel.style.pointerEvents = "none";
          }

          footer.appendChild(upvoteLabel);

          // mega upvote — only shown when both textboxes have the same value
          if (muvMode) {
            const megaLabel = document.createElement("label");
            megaLabel.className = "mega-label" + (hasMegaVoted ? " voted" : "");

            const megaChk = document.createElement("input");
            megaChk.type = "checkbox";
            megaChk.checked = hasMegaVoted;

            const megaBox = document.createElement("span");
            megaBox.className = "mega-box";

            const megaText = document.createElement("span");
            megaText.textContent = "mega upvote";

            megaLabel.appendChild(megaChk);
            megaLabel.appendChild(megaBox);
            megaLabel.appendChild(megaText);

            if (!hasMegaVoted) {
              megaLabel.addEventListener("click", async () => {
                const secret = ideaInput.value;
                megaLabel.classList.add("voted");
                div.classList.add("mega");
                markMegaVoted(post.ideaNumber);
                megaLabel.style.pointerEvents = "none";

                const creditEl = div.querySelector(".mega-credit");
                if (creditEl) creditEl.style.display = "block";

                try {
                  await fetch(API_URL, {
                    method: "PATCH",
                    headers: {
                      "Content-Type": "application/json",
                      "X-MUV-Secret": secret
                    },
                    body: JSON.stringify({ id: post.ideaNumber, type: "mega" })
                  });
                } catch {}
              });
            } else {
              megaLabel.style.pointerEvents = "none";
            }

            footer.appendChild(megaLabel);
          }

          div.appendChild(meta);
          div.appendChild(textEl);
          div.appendChild(footer);

          if (isMega) {
            const credit = document.createElement("div");
            credit.className = "mega-credit";
            credit.textContent = "(This idea was upvoted by idktoast)";
            div.appendChild(credit);
          }

          ideasContainer.appendChild(div);
        });

      } catch (err) {
        console.error(err);
        ideasContainer.innerHTML = "<p>error loading ideas.</p>";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const idea = ideaInput.value.trim();
      const name = nameInput.value.trim() || "anonymous";
      if (!idea) return;

      formMessage.style.color = "#fff";
      formMessage.textContent = "submitting...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idea, name })
        });
        const data = await res.json();
        if (data.success) {
          formMessage.innerHTML = "<br>idea submitted!";
          ideaInput.value = "";
          nameInput.value = "";
          loadIdeas();
        } else {
          formMessage.textContent = "oops, something went wrong!";
        }
      } catch {
        formMessage.textContent = "network error";
      }
    });

    function escapeHTML(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    loadIdeas();
  </script>

  <script data-goatcounter="https://idktoast.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
