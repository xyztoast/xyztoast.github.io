<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="https://hello.mcbcode.com/theme.css">
  <meta charset="utf-8" />
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ideas</title>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      font-family: 'mcfont', sans-serif;
      background: #212425;
      font-weight: 0;
      color: #bebebe;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: "mcfontb", sans-serif;
      font-size: 40px;
      margin-top: 20vh;
    }
    h2 { font-size: 25px; }
    
    a {
      color: #00b2ff;
      text-decoration: none;
      padding: 8px 8px;
      white-space: nowrap;
      background-color: #323738;
      transition: background-color 0.1s ease-in-out, padding 0.1s ease-in-out;
    }
    a:hover {
      background-color: #44494a;
      color: #5acaff;
      padding: 8px 26px;
    }
    p { padding: 6px; }

    .spacing { padding-top: 50px; }

    /* Form Styles */
    .form {
      margin-left: 20%;
      margin-right: 20%;
      text-align: center;
    }
    textarea {
      resize: none;
      outline: none;
      border: none;
      font-size: 16px;
      height: 100px;
      font-family: mcfont;
      background-color: #323738;
      color: #ffffff;
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .mod-ideas {
      display: flex;
      width: 100%;
      gap: 8px;
      margin-top: 8px;
    }
    #name-input {
      flex: 1;
      height: 40px;
    }
    .submit {
      background-color: #00b2ff;
      color: #000000;
      font-size: 16px;
      padding: 8px 20px;
      user-select: none;
      border: none;
      cursor: pointer;
      transition: background-color 0.1s ease-in-out;
    }
    .submit:hover { background-color: #5acaff; }

    /* Idea Post Styles */
    #ideas-container {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .idea-post {
      background-color: #323738;
      margin-left: 5%;
      margin-right: 5%;
      padding: 16px;
      text-align: left;
      border-left: 4px solid #00b2ff;
    }
    .username {
      color: #00b2ff;
      font-family: mcfontb;
      font-size: 14px;
    }
    .idea-text {
      margin-top: 8px;
      color: #fffff;
      word-wrap: break-word;
      font-weight: 0 !important;
    }
    
  </style>
</head>
<body>

  <div class="spacing" style="padding-top: 5%;">
    <div class="form">
      <h2>if only this was a mod...</h2>
      <p>drop your mod ideas here</p>
      
      <form id="mod-form">
        <textarea id="idea-input" placeholder="what if you made a..." required></textarea>
        <div class="mod-ideas">
          <textarea id="name-input" placeholder="name" maxlength="20"></textarea>
          <button type="submit" id="submit-btn" class="submit">submit</button>
        </div>
        <div id="form-message"></div>
      </form>
      
      <div class="spacing">
        <h2>other ideas</h2>
        <p>more ideas made by other people</p>
      </div>

      <div id="ideas-container">
        <p>Loading ideas...</p>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const API_URL = "https://ideas-hello.mcbcode.com"; 

    const form = document.querySelector("#mod-form");
    const ideaInput = document.querySelector("#idea-input");
    const nameInput = document.querySelector("#name-input");
    const formMessage = document.querySelector("#form-message");
    const ideasContainer = document.querySelector("#ideas-container");

    // 1. Fetch and Display Ideas
    async function loadIdeas() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("Failed to fetch");
        const ideas = await res.json();

        if (ideas.length === 0) {
          ideasContainer.innerHTML = "<p>No ideas yet. Be the first!</p>";
          return;
        }

        ideasContainer.innerHTML = ideas.map(post => `
          <div class="idea-post">
            <div class="username">${escapeHTML(post.name || "anonymous")}</div>
            <div class="idea-text">${escapeHTML(post.idea)}</div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        ideasContainer.innerHTML = "<p>Error loading ideas.</p>";
      }
    }

    // 2. Handle Upvote (PATCH)
    async function handleUpvote(id, checkbox) {
      if (!checkbox.checked) return; // Prevent "un-liking" for now

      try {
        const res = await fetch(API_URL, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id })
        });

        if (res.ok) {
          const countSpan = document.getElementById(`count-${id}`);
          countSpan.textContent = parseInt(countSpan.textContent) + 1;
          checkbox.disabled = true; // Disable to prevent spam
        }
      } catch (err) {
        console.error("Upvote failed:", err);
      }
    }

    // 3. Handle Submit (POST)
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const idea = ideaInput.value.trim();
      const name = nameInput.value.trim() || "anonymous";

      if (!idea) return;

      formMessage.style.color = "#fff";
      formMessage.textContent = "submitting...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idea, name })
        });

        const data = await res.json();

        if (data.success) {
          formMessage.innerHTML = "<br>idea submitted!";
          ideaInput.value = "";
          nameInput.value = "";
          loadIdeas(); // Refresh the list
        } else {
          formMessage.textContent = "oops, something went wrong!";
        }
      } catch (err) {
        formMessage.textContent = "network error";
      }
    });

    // Helper to prevent script injection
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Initial Load
    loadIdeas();
  </script>

  <script data-goatcounter="https://idktoast.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
