<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="https://hello.mcbcode.com/theme.css">
  <meta charset="utf-8" />
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ideas</title>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      font-family: 'mcfont', sans-serif;
      background: #212425;
      font-weight: 0;
      color: #bebebe;
    }
    h2 { font-size: 25px; }
    a {
      color: #00b2ff;
      text-decoration: none;
      padding: 8px 8px;
      white-space: nowrap;
      background-color: #323738;
      transition: background-color 0.1s ease-in-out, padding 0.1s ease-in-out;
    }
    a:hover {
      background-color: #44494a;
      color: #5acaff;
      padding: 8px 26px;
    }
    p { padding: 6px; }

    .form {
      margin-left: 5%;
      margin-right: 5%;
      text-align: center;
    }
    textarea {
      resize: none;
      outline: none;
      border: none;
      font-size: 16px;
      height: 100px;
      font-family: mcfont;
      background-color: #323738;
      color: #ffffff;
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .mod-ideas {
      display: flex;
      width: 100%;
      gap: 8px;
      margin-top: 8px;
    }
    #name-input {
      flex: 1;
      height: 40px;
    }
    .submit {
      background-color: #00b2ff;
      color: #000000;
      font-size: 16px;
      padding: 8px 20px;
      user-select: none;
      border: none;
      cursor: pointer;
      transition: background-color 0.1s ease-in-out;
    }
    .submit:hover { background-color: #5acaff; }

    /* sort bar */
    .sort-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 12px;
    }
    .sort-btn {
      background: #323738;
      color: #6b7172;
      border: none;
      font-family: mcfont;
      font-size: 13px;
      padding: 5px 12px;
      cursor: pointer;
      transition: color 0.1s, background 0.1s;
    }
    .sort-btn:hover { color: #bebebe; }
    .sort-btn.active { color: #00b2ff; background: #2a3a40; }

    #ideas-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .idea-post {
      background-color: #323738;
      margin-left: 1%;
      margin-right: 1%;
      padding: 16px;
      text-align: left;
      border-left: 4px solid #00b2ff;
      transition: border-color 0.2s ease, border-left-width 0.2s ease;
    }
    .idea-post.mega {
      border-left-color: #05ee93;
      background-color: #05ee93;
    }
    .idea-post.mega .idea-num,
    .idea-post.mega .idea-username,
    .idea-post.mega .idea-date,
    .idea-post.mega .idea-text,
    .idea-post.mega .idea-meta,
    .idea-post.mega .upvote-label,
    .idea-post.mega .mega-label,
    .idea-post.mega .mega-credit,
    .idea-post.mega span {
      color: #212425 !important;
    }
    .idea-post.mega .upvote-box {
      border-color: #212425;
    }
    .idea-post.mega .upvote-label.voted .upvote-box {
      border-color: #212425;
      background: #21242533;
    }
    .idea-post.mega .upvote-label.voted .upvote-box::after {
      background: #212425;
    }
    .idea-post.hot-1 { border-left-width: 5px; }
    .idea-post.hot-2 { border-left-width: 7px; }
    .idea-post.hot-3 { border-left-width: 10px; }

    .idea-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .idea-num { color: #00b2ff; font-family: mcfontb; }
    .idea-post.mega .idea-num { color: #05ee93; }
    .idea-username { color: #00b2ff; font-family: mcfontb; }
    .idea-post.mega .idea-username { color: #05ee93; }
    .idea-date { color: #6b7172; font-size: 12px; }
    .idea-text { margin-top: 8px; color: #ebebeb; word-wrap: break-word; }

    .idea-footer {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .upvote-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: #6b7172;
      transition: color 0.1s;
    }
    .upvote-label:hover { color: #bebebe; }
    .upvote-label input[type="checkbox"] { display: none; }
    .upvote-box {
      width: 16px;
      height: 16px;
      border: 1px solid #6b7172;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.1s, background 0.1s;
    }
    .upvote-label.voted .upvote-box { border-color: #00b2ff; background: #00b2ff22; }
    .upvote-label.voted { color: #00b2ff; }
    .upvote-label.voted .upvote-box::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #00b2ff;
      display: block;
    }

    .mega-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: #6b7172;
      transition: color 0.1s;
    }
    .mega-label:hover { color: #05ee93; }
    .mega-label input[type="checkbox"] { display: none; }
    .mega-box {
      width: 16px;
      height: 16px;
      border: 1px solid #05ee93;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.1s;
    }
    .mega-label.voted { color: #05ee93; }
    .mega-label.voted .mega-box { background: #05ee9322; }
    .mega-label.voted .mega-box::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #05ee93;
      display: block;
    }
    .mega-credit { font-size: 12px; color: #6b7172; margin-top: 6px; }
    .spacing { padding-top: 50px; }

    /* muv button in corner */
    #muv-btn {
      position: fixed;
      bottom: 14px;
      right: 14px;
      width: 18px;
      height: 18px;
      background: #2a2e2f;
      border: 1px solid #383d3e;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.15s;
      z-index: 100;
    }
    #muv-btn:hover { opacity: 0.7; }

    /* muv modal */
    #muv-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000aa;
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #muv-modal.open { display: flex; }
    #muv-box {
      background: #212425;
      border: 1px solid #383d3e;
      padding: 20px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #muv-box p { padding: 0; margin: 0; font-size: 13px; color: #6b7172; }
    #muv-input {
      height: 36px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      background: #323738;
      border: none;
      outline: none;
      color: #fff;
      font-family: mcfont;
      padding: 6px 8px;
      letter-spacing: 3px;
    }
    #muv-submit {
      background: #00b2ff;
      color: #000;
      border: none;
      font-family: mcfont;
      font-size: 14px;
      padding: 7px 0;
      cursor: pointer;
      transition: background 0.1s;
    }
    #muv-submit:hover { background: #5acaff; }
    #muv-submit.active-mode { background: #05ee93; color: #000; }
    #muv-error { color: #ff4444; font-size: 12px; min-height: 14px; }
    #muv-close {
      align-self: flex-end;
      background: none;
      border: none;
      color: #6b7172;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }
  </style>
</head>
<body>

  <div style="padding-top: 5%;">
    <div class="form">
      <h2>if only this was a mod...</h2>
      <p>drop your mod ideas here</p>

      <form id="mod-form">
        <textarea id="idea-input" placeholder="what if you made a..." required></textarea>
        <div class="mod-ideas">
          <textarea id="name-input" placeholder="name" maxlength="20"></textarea>
          <button type="submit" class="submit">submit</button>
        </div>
        <div id="form-message"></div>
      </form>

      <div class="spacing">
        <h2>other ideas</h2>
        <p>more ideas made by other people</p>
      </div>

      <div class="sort-bar">
        <button class="sort-btn active" data-sort="newest">newest</button>
        <button class="sort-btn" data-sort="oldest">oldest</button>
        <button class="sort-btn" data-sort="most">most upvotes</button>
        <button class="sort-btn" data-sort="least">least upvotes</button>
      </div>

      <div id="ideas-container">
        <p>loading ideas...</p>
      </div>
    </div>
  </div>
  <br><br><br><br><br>

  <!-- muv corner button -->
  <div id="muv-btn" title=""></div>

  <!-- muv modal -->
  <div id="muv-modal">
    <div id="muv-box">
      <button id="muv-close">x</button>
      <p>enter secret to enable mega upvotes</p>
      <input id="muv-input" type="password" placeholder="secret" autocomplete="off" />
      <div id="muv-error"></div>
      <button id="muv-submit">unlock</button>
    </div>
  </div>

  <script>
    const API_URL = "https://ideas-hello.mcbcode.com";

    const form = document.querySelector("#mod-form");
    const ideaInput = document.querySelector("#idea-input");
    const nameInput = document.querySelector("#name-input");
    const formMessage = document.querySelector("#form-message");
    const ideasContainer = document.querySelector("#ideas-container");

    let muvSecret = null;
    let allIdeas = [];
    let currentSort = "newest";

    // --- localStorage helpers ---
    function getVoted() {
      try { return JSON.parse(localStorage.getItem("voted_ideas") || "[]"); }
      catch { return []; }
    }
    function markVoted(id) {
      const v = getVoted();
      if (!v.includes(String(id))) v.push(String(id));
      localStorage.setItem("voted_ideas", JSON.stringify(v));
    }
    function unmarkVoted(id) {
      const v = getVoted().filter(x => x !== String(id));
      localStorage.setItem("voted_ideas", JSON.stringify(v));
    }
    function getMegaVoted() {
      try { return JSON.parse(localStorage.getItem("mega_voted_ideas") || "[]"); }
      catch { return []; }
    }
    function markMegaVoted(id) {
      const v = getMegaVoted();
      if (!v.includes(String(id))) v.push(String(id));
      localStorage.setItem("mega_voted_ideas", JSON.stringify(v));
    }

    // --- muv modal ---
    const muvBtn = document.querySelector("#muv-btn");
    const muvModal = document.querySelector("#muv-modal");
    const muvClose = document.querySelector("#muv-close");
    const muvInput = document.querySelector("#muv-input");
    const muvSubmit = document.querySelector("#muv-submit");
    const muvError = document.querySelector("#muv-error");

    muvBtn.addEventListener("click", () => muvModal.classList.add("open"));
    muvClose.addEventListener("click", () => { muvModal.classList.remove("open"); muvError.textContent = ""; muvInput.value = ""; });
    muvModal.addEventListener("click", (e) => { if (e.target === muvModal) { muvModal.classList.remove("open"); muvError.textContent = ""; muvInput.value = ""; } });

    muvSubmit.addEventListener("click", async () => {
      if (muvSubmit.classList.contains("active-mode")) {
        muvSecret = null;
        muvSubmit.classList.remove("active-mode");
        muvSubmit.textContent = "unlock";
        muvModal.classList.remove("open");
        renderIdeas();
        return;
      }

      const val = muvInput.value;
      if (!val) { muvError.textContent = "enter the secret"; return; }

      // verify by attempting a dummy mega patch — worker will 403 if wrong
      try {
        const res = await fetch(API_URL, {
          method: "PATCH",
          headers: { "Content-Type": "application/json", "X-MUV-Secret": val },
          body: JSON.stringify({ id: 0, type: "mega_check" })
        });
        const data = await res.json();
        if (res.status === 403) {
          muvError.textContent = "wrong secret";
          return;
        }
        muvSecret = val;
        muvSubmit.classList.add("active-mode");
        muvSubmit.textContent = "disable";
        muvError.textContent = "";
        muvModal.classList.remove("open");
        renderIdeas();
      } catch {
        muvError.textContent = "network error";
      }
    });

    // --- sort ---
    document.querySelectorAll(".sort-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSort = btn.dataset.sort;
        renderIdeas();
      });
    });

    function getSorted(ideas) {
      const copy = [...ideas];
      if (currentSort === "newest") return copy.sort((a, b) => b.ideaNumber - a.ideaNumber);
      if (currentSort === "oldest") return copy.sort((a, b) => a.ideaNumber - b.ideaNumber);
      if (currentSort === "most") return copy.sort((a, b) => b.upvotes - a.upvotes);
      if (currentSort === "least") return copy.sort((a, b) => a.upvotes - b.upvotes);
      return copy;
    }

    function hotClass(upvotes, max) {
      if (max === 0) return "";
      const ratio = upvotes / max;
      if (ratio >= 0.75) return " hot-3";
      if (ratio >= 0.4) return " hot-2";
      if (ratio >= 0.15) return " hot-1";
      return "";
    }

    function formatDate(ts) {
      if (!ts) return "";
      const d = new Date(ts.includes("T") ? ts : ts + "Z");
      if (isNaN(d)) return "";
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return months[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear();
    }

    function renderIdeas() {
      if (!allIdeas.length) {
        ideasContainer.innerHTML = "<p>no ideas yet. be the first!</p>";
        return;
      }

      const voted = getVoted();
      const megaVoted = getMegaVoted();
      const sorted = getSorted(allIdeas);
      const maxUpvotes = Math.max(...allIdeas.map(p => p.upvotes || 0));

      ideasContainer.innerHTML = "";

      sorted.forEach((post, index) => {
        const isMega = post.mega_upvoted === 1;
        const hasVoted = voted.includes(String(post.ideaNumber));
        const hasMegaVoted = megaVoted.includes(String(post.ideaNumber));
        const num = post.ideaNumber;
        const hot = hotClass(post.upvotes || 0, maxUpvotes);

        const div = document.createElement("div");
        div.className = "idea-post" + (isMega ? " mega" : "") + hot;

        const meta = document.createElement("div");
        meta.className = "idea-meta";
        meta.innerHTML =
          '<span class="idea-num">#' + num + '</span>' +
          '<span style="color:#6b7172">|</span>' +
          '<span class="idea-username">' + escapeHTML(post.name || "anonymous") + '</span>' +
          '<span style="color:#6b7172">|</span>' +
          '<span class="idea-date">' + formatDate(post.timestamp) + '</span>';

        const textEl = document.createElement("div");
        textEl.className = "idea-text";
        textEl.textContent = post.idea;

        const footer = document.createElement("div");
        footer.className = "idea-footer";

        // upvote — use div not label to avoid checkbox double-fire
        const upvoteLabel = document.createElement("div");
        upvoteLabel.className = "upvote-label" + (hasVoted ? " voted" : "");

        const upvoteBox = document.createElement("span");
        upvoteBox.className = "upvote-box";

        const upvoteCount = document.createElement("span");
        upvoteCount.textContent = post.upvotes || 0;

        upvoteLabel.appendChild(upvoteBox);
        upvoteLabel.appendChild(upvoteCount);

        let isVoted = hasVoted;
        upvoteLabel.addEventListener("click", async () => {
          if (isVoted) {
            isVoted = false;
            upvoteLabel.classList.remove("voted");
            upvoteCount.textContent = Math.max(0, parseInt(upvoteCount.textContent) - 1);
            post.upvotes = Math.max(0, (post.upvotes || 0) - 1);
            unmarkVoted(post.ideaNumber);
            try {
              await fetch(API_URL, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: post.ideaNumber, type: "unvote" })
              });
            } catch {}
          } else {
            isVoted = true;
            upvoteLabel.classList.add("voted");
            upvoteCount.textContent = parseInt(upvoteCount.textContent) + 1;
            post.upvotes = (post.upvotes || 0) + 1;
            markVoted(post.ideaNumber);
            try {
              await fetch(API_URL, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: post.ideaNumber, type: "upvote" })
              });
            } catch {}
          }
        });

        footer.appendChild(upvoteLabel);

        // mega upvote
        if (muvSecret) {
          const megaLabel = document.createElement("div");
          megaLabel.className = "mega-label" + (hasMegaVoted ? " voted" : "");

          const megaBox = document.createElement("span");
          megaBox.className = "mega-box";

          const megaText = document.createElement("span");
          megaText.textContent = "mega upvote";

          megaLabel.appendChild(megaBox);
          megaLabel.appendChild(megaText);

          if (!hasMegaVoted) {
            megaLabel.addEventListener("click", async () => {
              megaLabel.classList.add("voted");
              div.classList.add("mega");
              markMegaVoted(post.ideaNumber);
              megaLabel.style.pointerEvents = "none";
              const creditEl = div.querySelector(".mega-credit");
              if (creditEl) creditEl.style.display = "block";
              try {
                await fetch(API_URL, {
                  method: "PATCH",
                  headers: { "Content-Type": "application/json", "X-MUV-Secret": muvSecret },
                  body: JSON.stringify({ id: post.ideaNumber, type: "mega" })
                });
              } catch {}
            });
          } else {
            megaLabel.style.pointerEvents = "none";
          }

          footer.appendChild(megaLabel);
        }

        div.appendChild(meta);
        div.appendChild(textEl);
        div.appendChild(footer);

        if (isMega) {
          const credit = document.createElement("div");
          credit.className = "mega-credit";
          credit.textContent = "(This idea was upvoted by idktoast)";
          div.appendChild(credit);
        }

        ideasContainer.appendChild(div);
      });
    }

    async function loadIdeas() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("fetch failed");
        allIdeas = await res.json();
        renderIdeas();
      } catch (err) {
        console.error(err);
        ideasContainer.innerHTML = "<p>error loading ideas.</p>";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const idea = ideaInput.value.trim();
      const name = nameInput.value.trim() || "anonymous";
      if (!idea) return;

      formMessage.style.color = "#fff";
      formMessage.textContent = "submitting...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idea, name })
        });
        const data = await res.json();
        if (data.success) {
          formMessage.innerHTML = "<br>idea submitted!";
          ideaInput.value = "";
          nameInput.value = "";
          loadIdeas();
        } else {
          formMessage.textContent = "oops, something went wrong!";
        }
      } catch {
        formMessage.textContent = "network error";
      }
    });

    function escapeHTML(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    loadIdeas();
  </script>

  <script data-goatcounter="https://idktoast.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
