  <link rel="manifest" href="/manifest.json">

  <title>idktoast mods</title>
  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:'mcfont', sans-serif;
      background:#212425;
      color:#bebebe;
    }
    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      text-align:center;
    }
    h1{
      margin:0;
      font-family: "mcfontb", sans-serif;
    }
    a{
      color:#00b2ff;
      text-decoration:none;
      font-weight:400;
      padding:6px 5px;
      border-radius:6px;
      background-color: #323738;
    }
    .links{
      display:flex;
      gap:12px;
    }
    .download-wrap{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:16px;
    }
      .account-link {
    position: fixed;
    top: 16px;
    right: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    text-decoration: none;
    color: #f0f0f0;
  }

  .mcbc {
    position: fixed;
    left: 5px;
    top: 10px;
    height: 50px;
    width: 50px;
    animation-duration: 1s;
    animation-delay: 0s;
    animation-name: slide;
  }
  @keyframes slide {
    0% {
      transform: translateY(-1000px); /* Start position */
    }
    100% {
      transform: translateY(0px); /* End position */
    }
  }
  img:hover {
    filter: brightness(120%);
    }
  img {
    border-radius: 5px;
    }
    
  .wiki-icon {
    position: fixed;
    line-height: 0;
    left: 55px;
    top: 10px;
    height: 50px;
    width: 50px;
    animation-duration: 1.2s;
    animation-delay: 0s;
    animation-name: slide2;
  }
  @keyframes slide2 {
    0% {
      transform: translateY(-1000px); /* Start position */
    }
    100% {
      transform: translateY(0px); /* End position */
    }
  }
    
  .avatar {
    width: 32px;
    height: 32px;
    background: #212425;
    border-radius: 50%;
    display: grid;
    place-items: center;
    padding: 4px;
  }

  .account-text {
    text-transform: lowercase;
    user-select: none;
  }

  .account-link:hover {
    opacity: .8;
  }
  </style>
</head>
<body>
  <div class="wrap">
