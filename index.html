<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="/theme.css">
  <meta charset="utf-8" />
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>idktoast mods</title>
  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:'mcfont', sans-serif;
      background:#212425;
      color:#bebebe;
    }
    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      text-align:center;
    }
    h1{
      font-weight:700;
      margin:0;
      font-family: "mcfontb", sans-serif;
    }
    a{
      color:#00b2ff;
      text-decoration:none;
      color: #0f0f0f
      font-weight:400;
      padding:6px 5px;
      border-radius:6px;
      background-color: #323738;
    }
    .links{
      display:flex;
      gap:12px;
    }
    .download-wrap{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:16px;
    }
      .account-link {
    position: fixed;
    top: 16px;
    right: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    text-decoration: none;
    color: #f0f0f0;
  }

  .avatar {
    width: 32px;
    height: 32px;
    background: #212425;
    border-radius: 50%;
    display: grid;
    place-items: center;
    padding: 4px;
  }

  .account-text {
    text-transform: lowercase;
    user-select: none;
  }

  .account-link:hover {
    opacity: .8;
  }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>idktoast mods</h1>
    <p>im a small minecraft bedrock mod creator and like expirementing with code.<br> <br>you can download my mods by clicking the first two buttons.<p>
    <div class="links">
      <a href="https://www.curseforge.com/members/idktoast/projects" target="_blank" rel="noopener noreferrer">curseforge</a>
      <a href="https://mcpedl.com/user/idktoast" target="_blank" rel="noopener noreferrer">mcpedl</a>
      <a href="https://github.com/xyztoast/xyztoast.github.io" rel="noopener noreferrer">github repository</a>
    </div>

    <div class="download-wrap">
      <div>download the webapp</div>
      <a href="app" rel="noopener noreferrer">download</a>
    </div>

  </div>

  <a class="account-link" href="https://xyztoast.github.io/account">
  <span class="avatar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 12.75c1.986 0 3.6-1.614 3.6-3.6S13.986 5.55 12 5.55 8.4 7.164 8.4 9.15s1.614 3.6 3.6 3.6z" fill="#bfc7cc"/>
      <path d="M4.5 19.2c0-2.64 3.96-4.8 7.5-4.8s7.5 2.16 7.5 4.8v.3H4.5v-.3z" fill="#bfc7cc"/>
    </svg>
  </span>
  <span class="account-text">account</span>
  </a>
  
</body>
</html>
