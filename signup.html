<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/theme.css">
  <title>sign up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background:#212425;
      color:#fff;
      font-family: sans-serif;
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container {
      text-align:center;
      background:#323738;
      padding:40px;
      border-radius:8px;
      width:300px;
    }

    h2 {
      margin:0 0 20px 0;
      font-size:24px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #212425;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width:100%;
      padding:12px;
      margin-top:15px;
      background:#00b2ff;
      color:#000;
      border:none;
      border-radius:4px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    a {
      color:#00b2ff;
      text-decoration:none;
    }

    .smalltext {
      margin-top:15px;
      font-size:14px;
    }

    #msg {
      margin-top:10px;
      font-size:14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>create account</h2>

    <input id="email" type="email" placeholder="email" />
    <p></p>
    <input id="password" type="password" placeholder="password" />

    <button onclick="signup()">sign up</button>

    <p id="msg"></p>

    <p class="smalltext">
      already registered?
      <a href="https://xyztoast.github.io/login">log in</a>
    </p>
  </div>

<script>
  const client = supabase.createClient(
    "https://cinbonvmvzmnkdvhfsjg.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpbmJvbnZtdnptbmtkdmhmc2pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5OTI5NjQsImV4cCI6MjA3OTU2ODk2NH0.gzijxk-TpJ9FfEbNXPdQ8ODJksH5TOjaYXxF22rYLc8"
  )

  async function signup() {
    const email = document.getElementById("email").value
    const password = document.getElementById("password").value

    const { data, error } = await client.auth.signUp({
      email,
      password
    })

    if (error) {
      document.getElementById("msg").textContent = error.message
    } else {
      window.location.href = "https://xyztoast.github.io/login"
    }
  }
</script>
</body>
</html>
