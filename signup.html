<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>sign up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background:#212425;
      color:#fff;
      font-family:sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .panel {
      background:#323738;
      padding:20px;
      border-radius:8px;
      width:300px;
      text-align:center;
    }
    input {
      width:100%;
      padding:10px;
      margin:5px 0;
      border:none;
      border-radius:4px;
    }
    button {
      width:100%;
      padding:10px;
      border:none;
      border-radius:4px;
      background:#00b2ff;
      color:#000;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }
    a {
      color:#00b2ff;
      text-decoration:none;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h2>sign up</h2>

    <input id="email" type="email" placeholder="email" />
    <input id="password" type="password" placeholder="password" />

    <button onclick="signup()">create account</button>

    <p id="msg"></p>

    <p style="margin-top:10px;">
      already have an account?
      <a href="https://xyztoast.github.io/login">log in</a>
    </p>
  </div>

  <script>
    const supabase = supabase.createClient(
      "https://cinbonvmvzmnkdvhfsjg.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpbmJvbnZtdnptbmtkdmhmc2pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5OTI5NjQsImV4cCI6MjA3OTU2ODk2NH0.gzijxk-TpJ9FfEbNXPdQ8ODJksH5TOjaYXxF22rYLc8"
    );

    async function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: "https://xyztoast.github.io/login"
        }
      });

      if (error) {
        document.getElementById("msg").textContent = error.message;
      } else {
        document.getElementById("msg").textContent =
          "check ur email to confirm";
      }
    }
  </script>
</body>
</html>
