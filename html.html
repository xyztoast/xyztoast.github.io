<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Preview Tool</title>

<!-- Highlight.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>

<style>
:root {
    --accent: #00b2ff;
    --bg: #212425;
    --panel: #323738;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    background: var(--bg);
    color: white;
    font-family: monospace;
    overflow: hidden;
}

/* Editor Wrapper */
#editorWrapper {
    position: relative;
    width: 50%;
    height: 100%;
}

/* Highlight Layer */
#highlightLayer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 12px;
    font-size: 14px;
    line-height: 1.4;
    margin: 0;
    overflow: auto;
    pointer-events: none;
    white-space: pre-wrap;
    background: var(--panel);
    z-index: 0;
}

#highlightLayer code {
    margin: 0;
    display: block;
}

/* Editor */
#editor {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: transparent;
    caret-color: white;
    padding: 12px;
    font-size: 14px;
    line-height: 1.4;
    overflow: auto;
    white-space: pre-wrap;
    z-index: 1;
}

#preview {
    width: 50%;
    height: 100%;
    border: none;
    background: var(--bg);
}

/* Settings Menu */
#settingsMenu {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel);
    padding: 20px;
    border-radius: 12px;
    border: 2px solid var(--accent);
    display: none;
    width: 320px;
    z-index: 999;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

.setting {
    margin-bottom: 15px;
}

.setting label {
    display: block;
    margin-bottom: 5px;
}

input[type="range"] {
    width: 100%;
}

.toggle {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

input[type="checkbox"] {
    transform: scale(1.2);
}

/* Mobile Button */
#mobileSettingsBtn {
    position: fixed;
    bottom: 16px;
    left: 16px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    z-index: 999;
}

</style>
</head>

<body>

<div id="editorWrapper">
    <pre id="highlightLayer"><code class="language-html"></code></pre>
    <textarea id="editor" placeholder="Write HTML here..."></textarea>
</div>

<iframe id="preview"></iframe>

<div id="settingsMenu">

<div class="setting">
<label>Preview Size (%)</label>
<input type="range" id="previewSize" min="0" max="100" value="50">
</div>

<div class="setting toggle">
<label>Highlighting</label>
<input type="checkbox" id="highlightToggle" checked>
</div>

<div class="setting toggle">
<label>Live Preview</label>
<input type="checkbox" id="liveToggle" checked>
</div>

<div class="setting toggle">
<label>Wrap Text</label>
<input type="checkbox" id="wrapToggle" checked>
</div>

</div>

<button id="mobileSettingsBtn">⚙</button>

<script>

const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const menu = document.getElementById("settingsMenu");

const highlightLayer = document.querySelector("#highlightLayer code");
const highlightBox = document.getElementById("highlightLayer");

const previewSize = document.getElementById("previewSize");
const highlightToggle = document.getElementById("highlightToggle");
const liveToggle = document.getElementById("liveToggle");
const wrapToggle = document.getElementById("wrapToggle");

let liveEnabled = true;

function updatePreview() {
    if (!liveEnabled) return;

    const code = editor.value;
    const doc = preview.contentDocument || preview.contentWindow.document;

    doc.open();
    doc.write(code);
    doc.close();
}

function updateHighlight() {
    if (!highlightToggle.checked) {
        highlightLayer.textContent = editor.value;
        return;
    }

    const highlighted = hljs.highlight(editor.value, {
        language: "html"
    }).value;

    highlightLayer.innerHTML = highlighted;
}

editor.addEventListener("input", () => {
    updatePreview();
    updateHighlight();
});

editor.addEventListener("scroll", () => {
    highlightBox.scrollTop = editor.scrollTop;
    highlightBox.scrollLeft = editor.scrollLeft;
});

previewSize.addEventListener("input", () => {
    const percent = previewSize.value;

    preview.style.width = percent + "%";
    document.getElementById("editorWrapper").style.width = (100 - percent) + "%";
});

highlightToggle.addEventListener("change", () => {
    updateHighlight();
});

liveToggle.addEventListener("change", () => {
    liveEnabled = liveToggle.checked;
    updatePreview();
});

wrapToggle.addEventListener("change", () => {
    if (wrapToggle.checked) {
        editor.style.whiteSpace = "pre-wrap";
        highlightBox.style.whiteSpace = "pre-wrap";
    } else {
        editor.style.whiteSpace = "pre";
        highlightBox.style.whiteSpace = "pre";
    }
});

// Alt + Q menu toggle
window.addEventListener("keydown", (e) => {
    if (e.altKey && e.key.toLowerCase() === "q") {
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }
});

// Mobile button toggle
const mobileBtn = document.getElementById("mobileSettingsBtn");

mobileBtn.addEventListener("click", () => {
    menu.style.display = (menu.style.display === "block") ? "none" : "block";
});

// Initial render
updatePreview();
updateHighlight();

</script>

</body>
</html>
